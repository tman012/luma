    <!-- Startup splash: painted from this file alone, before any script. Values mirror SPLASH_MOTION (theme/motion.ts).
         One color from the OS launch screen (manifest, iOS launch images) through the splash to Home. -->
    <style>
      html, body, #root { margin: 0; background: #15102a; }
      html[data-splash] #root { opacity: 0; }
      #splash { position: fixed; top: 0; left: 0; right: 0; bottom: 0; z-index: 9000; touch-action: none; }
      #splash-bg { position: absolute; top: 0; left: 0; right: 0; height: 100vh; background: #15102a; }
      @supports (height: 100lvh) {
        #splash-bg { height: max(100%, calc(var(--luma-screen-h, 100lvh) + var(--luma-fixed-gap, 0px))); }
      }
      #splash-stage { position: absolute; top: 0; left: 0; right: 0; bottom: 0; display: flex; align-items: center; justify-content: center; }
      #splash-logo {
        position: relative; display: block; width: clamp(180px, 46vw, 340px); height: auto; aspect-ratio: 916 / 416;
        user-select: none; -webkit-user-select: none; pointer-events: none; will-change: transform;
      }
      #splash-mark, #splash-uma {
        position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: block;
        user-select: none; -webkit-user-select: none; pointer-events: none; will-change: transform, opacity;
      }
      #splash-mark { transform-origin: 22% 50%; animation: lumaSplashMark 520ms cubic-bezier(0.05, 0.7, 0.1, 1) both; }
      #splash-uma { animation: lumaSplashUma 560ms cubic-bezier(0.22, 0.61, 0.36, 1) 340ms both; }
      @keyframes lumaSplashMark { from { opacity: 0; transform: scale(0.72); } to { opacity: 1; transform: none; } }
      @keyframes lumaSplashUma {
        from { opacity: 0; transform: translateX(-5%); clip-path: inset(0 59% 0 41%); }
        to { opacity: 1; transform: none; clip-path: inset(0 0 0 41%); }
      }
      @keyframes lumaSplashFade { from { opacity: 0; } to { opacity: 1; } }
      @keyframes lumaHomeRise { from { transform: translateY(6px); } to { transform: none; } }
      html[data-splash="handoff"] #root { opacity: 1; transition: opacity 520ms cubic-bezier(0.4, 0, 0.2, 1); }
      html[data-splash="handoff"] [data-phone-rails] { animation: lumaHomeRise 520ms cubic-bezier(0.4, 0, 0.2, 1) both; }
      html[data-splash-flip] [data-splash-target] { visibility: hidden; }
      @media (prefers-reduced-motion: reduce) {
        #splash-mark, #splash-uma { animation: lumaSplashFade 120ms linear both; }
        html[data-splash="handoff"] #root { transition-duration: 200ms; }
        html[data-splash="handoff"] [data-phone-rails] { animation: none; }
      }
    </style>
