<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>Luma</title>
    <meta name="apple-mobile-web-app-title" content="Luma">
    <meta name="application-name" content="Luma">
    <link rel="manifest" href="/manifest.json" crossorigin="use-credentials">
    <link rel="apple-touch-icon" href="/static/images/apple-touch-icon.png">
    <meta name="theme-color" content="#15102a">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <!-- Splash screen styles only -->
    <style>
      #splash {
        position: fixed; inset: 0; z-index: 99999;
        display: flex; align-items: center; justify-content: center;
        background: radial-gradient(ellipse at 50% 30%, #262a66 0%, #15102a 55%, #0a0818 100%);
        color: rgba(255,255,255,0.92);
        font: 600 32px/1.2 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        transition: opacity 0.4s ease;
      }
      #splash.hide { opacity: 0; pointer-events: none; }
      #splash-status { margin: 0; display: flex; align-items: center; gap: 18px; min-height: 56px; }
      #splash-ring {
        width: 48px; height: 48px; box-sizing: border-box; border-radius: 50%;
        border: 4px solid rgba(255,255,255,0.25);
        border-top-color: #fff;
        display: inline-block; flex: none;
        animation: sp 0.9s linear infinite;
      }
      @keyframes sp { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) {
        #splash { transition: none; }
        #splash-ring { animation: none; }
      }
    </style>
  </head>
  <body>
    <!-- Splash screen — visible instantly, hidden once React mounts -->
    <div id="splash" role="status" aria-live="polite" aria-busy="true"><p id="splash-status"><span id="splash-ring"></span> Loading…</p></div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
