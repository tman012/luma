    <!-- Startup splash: painted from this file alone, before any script. Values mirror SPLASH_MOTION (theme/motion.ts). -->
    <style>
      html, body { margin: 0; background: #15102a; }
      #splash {
        position: fixed; top: 0; left: 0; right: 0; z-index: 9000; overflow: hidden; touch-action: none;
        height: 100vh; height: 100dvh;
      }
      @supports (height: 100lvh) {
        #splash { height: calc(var(--luma-screen-h, 100lvh) + var(--luma-fixed-gap, 0px)); }
      }
      #splash-bg { position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: #15102a; }
      #splash-stage { position: absolute; top: 0; left: 0; right: 0; bottom: 0; display: flex; align-items: center; justify-content: center; }
      #splash-logo {
        display: block; width: clamp(180px, 46vw, 340px); height: auto; aspect-ratio: 916 / 416;
        user-select: none; -webkit-user-select: none; pointer-events: none; will-change: transform, opacity;
        animation: lumaSplashIn 560ms cubic-bezier(0.05, 0.7, 0.1, 1) both;
      }
      @keyframes lumaSplashIn { from { opacity: 0; transform: scale(0.84); } to { opacity: 1; transform: none; } }
      @keyframes lumaSplashFade { from { opacity: 0; } to { opacity: 1; } }
      @media (prefers-reduced-motion: reduce) {
        #splash-logo { animation: lumaSplashFade 120ms linear both; }
      }
      html[data-splash-flip] [data-splash-target] { visibility: hidden; }
    </style>
