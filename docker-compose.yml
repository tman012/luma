# Luma — production compose file.
#
#   docker compose up -d --build
#
# Every host-specific value (paths, port, timezone, image name) comes from
# .env next to this file; see .env.example. Anything personal to one server
# (a reverse proxy, live-reload source mounts, extra volumes) belongs in an
# untracked docker-compose.override.yml, which compose loads automatically.
services:
  luma:
    container_name: ${LUMA_CONTAINER_NAME:-luma}
    image: ${LUMA_IMAGE:-luma:latest}
    build:
      context: .
      dockerfile: Dockerfile
    init: true  # Prevents zombie processes on container restart
    # Host networking lets Luma reach LAN devices directly (ADB to Android TV /
    # Shield, Plex clients, Kodi, Wake-on-LAN broadcasts). The web UI listens
    # on LUMA_PORT on the host.
    network_mode: host
    environment:
      # Automation schedules (e.g. "run at 22:30") use this timezone.
      - TZ=${TZ:-UTC}
      - FLASK_ENV=production
      - PORT=${LUMA_PORT:-5001}
      # Empty: the port saved in Settings (default 5001) is used
      - LUMA_PORT=${LUMA_PORT:-}
      - DATABASE_PATH=/app/data/media.db
      # API keys
      - TMDB_API_KEY=${TMDB_API_KEY:-}
      - OMDB_API_KEY=${OMDB_API_KEY:-}
      - FANART_API_KEY=${FANART_API_KEY:-}
      - YT_INNERTUBE_KEY=${YT_INNERTUBE_KEY:-}
      # Plex (library endpoints use the Plex HTTP API: PLEX_URL + PLEX_TOKEN)
      - PLEX_URL=${PLEX_URL:-}
      - PLEX_TOKEN=${PLEX_TOKEN:-}
      - PLEX_ACCOUNT_ID=${PLEX_ACCOUNT_ID:-1}
      - PLEX_MACHINE_ID=${PLEX_MACHINE_ID:-}
      - PLEX_DB=${PLEX_DB:-}
      # IP of an Android TV / Shield to seed the first room on first start
      - SHIELD_PLEX_IP=${SHIELD_PLEX_IP:-}
      # Sonarr / Radarr (Home Assistant and qBittorrent live in Settings)
      - SONARR_URL=${SONARR_URL:-}
      - SONARR_API_KEY=${SONARR_API_KEY:-}
      - RADARR_URL=${RADARR_URL:-}
      - RADARR_API_KEY=${RADARR_API_KEY:-}
      # Kodi: share root for file URLs when no Kodi source covers a path
      - KODI_NAS_BASE=${KODI_NAS_BASE:-}
      # Public URL used in e-mails and Telegram links (blank = request host)
      - APP_URL=${APP_URL:-}
      # Gmail (account-approval e-mails)
      - GMAIL_ADDRESS=${GMAIL_ADDRESS:-}
      - GMAIL_APP_PASSWORD=${GMAIL_APP_PASSWORD:-}
      # Telegram admin alerts (bot token lives in data/telegram_bot.json)
      - TELEGRAM_ADMIN_CHAT_ID=${TELEGRAM_ADMIN_CHAT_ID:-}
      - TELEGRAM_ACTION_SECRET=${TELEGRAM_ACTION_SECRET:-}
      # Service-to-service API key (X-API-Key; companion apps read rooms with it)
      - SERVICE_API_KEY=${SERVICE_API_KEY:-}
      # Flask session key
      - SECRET_KEY=${SECRET_KEY:-}
      # Admin seed (unset = no seeded admin)
      - LUMA_ADMIN_NAME=${LUMA_ADMIN_NAME:-}
      - LUMA_ADMIN_EMAIL=${LUMA_ADMIN_EMAIL:-}
      - LUMA_ADMIN_PIN=${LUMA_ADMIN_PIN:-}
      # Optional: path (inside the container) of a CA root certificate served
      # at /ca.crt so phones can trust a local HTTPS proxy
      - LUMA_CA_CERT_PATH=${LUMA_CA_CERT_PATH:-}
      # Container-side media paths (the host side is set by the volumes below)
      - DOWNLOADS_ROOT=/downloads
      - MOVIES_ROOT=/media/movies
      - TV_ROOT=/media/tv
      - RECENT_ROOT=/media/recent
      - FOURKAY_ROOT=/media/4k
      - FULLRIPS_ROOT=/media/fullrips
      - TV_4K_ROOT=/media/tv-4k
      - TV_REMUX_ROOT=/media/tv-remux
    volumes:
      # Persistent data (settings, databases, caches)
      - ${LUMA_DATA_DIR:-./data}:/app/data
      # ADB keys (only used when an Android TV / Shield device is added)
      - ${LUMA_ADB_KEYS_DIR:-./.android}:/app/home/.android
      # Completed downloads (auto-rename moves files from here)
      - ${LUMA_DOWNLOADS_DIR:-./media/downloads}:/downloads
      # Media library folders (write access needed for auto-rename)
      - ${LUMA_MOVIES_DIR:-./media/movies}:/media/movies
      - ${LUMA_RECENT_DIR:-./media/recent}:/media/recent
      - ${LUMA_TV_DIR:-./media/tv}:/media/tv
      - ${LUMA_4K_DIR:-./media/4k}:/media/4k
      - ${LUMA_FULLRIPS_DIR:-./media/fullrips}:/media/fullrips
      - ${LUMA_TV_4K_DIR:-./media/tv-4k}:/media/tv-4k
      - ${LUMA_TV_REMUX_DIR:-./media/tv-remux}:/media/tv-remux
      # Optional read-only copy of the Plex database folder (set PLEX_DB to
      # the .db file inside it). Plex's HTTP API is used for everything else.
      - ${LUMA_PLEX_DB_DIR:-./plexdb}:/mnt/plexdb:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "/app/scripts/healthcheck.py"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
