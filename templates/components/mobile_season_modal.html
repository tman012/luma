<script>
// Season Modal Functions
let currentSeasonData = null;
let seasonSourcesLoaded = false;

// --- Open Season Modal (redesigned Plex-style) ---
function openSeasonModal(season, ownedCount, totalEpisodes) {
    console.log('Opening season modal for:', season);
    currentSeasonData = season;
    seasonSourcesLoaded = false;

    // Reset UltraBlur
    resetSeasonUltraBlurColors();

    // --- Backdrop image (show's backdrop) ---
    const backdropImg = document.getElementById('seasonModalBackdropImage');
    const backdropUrl = window.currentTvShow ? (window.currentTvShow.backdrop_url || '') : '';
    if (backdropUrl) {
        backdropImg.src = backdropUrl;
        backdropImg.onload = function() { backdropImg.style.opacity = '1'; };
        backdropImg.onerror = function() { backdropImg.style.opacity = '0'; };
    } else {
        backdropImg.src = '';
        backdropImg.style.opacity = '0';
    }

    // --- Clearlogo or fallback title ---
    const clearlogoImg = document.getElementById('seasonModalClearlogo');
    const clearlogoFallback = document.getElementById('seasonModalClearlogoFallback');
    const clearlogoUrl = window.currentTvShow ? (window.currentTvShow.clearlogo_url || '') : '';
    const showTitle = window.currentTvShow ? (window.currentTvShow.title || window.currentTvShow.name || '') : '';

    if (clearlogoUrl) {
        clearlogoImg.src = clearlogoUrl;
        clearlogoImg.style.display = 'block';
        clearlogoFallback.style.display = 'none';
        clearlogoFallback.textContent = '';
        clearlogoImg.onerror = function() {
            clearlogoImg.style.display = 'none';
            clearlogoFallback.textContent = showTitle;
            clearlogoFallback.style.display = 'block';
        };
    } else {
        clearlogoImg.style.display = 'none';
        clearlogoImg.src = '';
        clearlogoFallback.textContent = showTitle;
        clearlogoFallback.style.display = showTitle ? 'block' : 'none';
    }

    // --- Season info ---
    document.getElementById('seasonInfoTitle').textContent = `Season ${season.season_number}`;
    const ownedLabel = ownedCount > 0 ? ` \u2022 ${ownedCount} Owned` : '';
    document.getElementById('seasonInfoSubtitle').textContent =
        `${totalEpisodes} Episode${totalEpisodes !== 1 ? 's' : ''}${ownedLabel}`;

    // --- Determine first episode for Watch button ---
    const seasonNum = season.season_number;
    const episodes = season.episodes || [];
    let watchEpNum = 1;
    // Find first non-owned episode in this season, or default to E01
    if (ownedCount > 0 && episodes.length > 0) {
        for (let i = 0; i < episodes.length; i++) {
            const epKey = `s${seasonNum}e${episodes[i].episode_number}`;
            const epOwn = (typeof episodeOwnership !== 'undefined') ? episodeOwnership[epKey] : null;
            if (!epOwn || !epOwn.owned) {
                watchEpNum = episodes[i].episode_number;
                break;
            }
            // If all owned, keep watchEpNum = 1
            if (i === episodes.length - 1) {
                watchEpNum = episodes[0].episode_number;
            }
        }
    } else if (episodes.length > 0) {
        watchEpNum = episodes[0].episode_number;
    }

    const sNum = String(seasonNum).padStart(2, '0');
    const eNum = String(watchEpNum).padStart(2, '0');

    // --- Show/hide buttons based on ownership ---
    const watchBtn = document.getElementById('seasonWatchButton');
    const watchBtnText = document.getElementById('seasonWatchButtonText');
    const sonarrBtn = document.getElementById('seasonSonarrAddButton');
    const actionRow = document.getElementById('seasonActionButtonsRow');

    if (ownedCount > 0) {
        // Owned (or partially owned) — show Watch + Sources
        watchBtnText.textContent = `Watch S${sNum}E${eNum}`;
        watchBtn.style.display = 'flex';
        sonarrBtn.style.display = 'none';
        actionRow.style.display = 'flex';
    } else {
        // Unowned — show Add to Sonarr, hide Watch + Sources
        watchBtn.style.display = 'none';
        actionRow.style.display = 'none';

        // Reset Sonarr button state
        sonarrBtn.style.display = 'flex';
        sonarrBtn.disabled = false;
        sonarrBtn.className = 'season-sonarr-add-button';
        document.getElementById('seasonSonarrAddIcon').className = 'fas fa-plus';
        document.getElementById('seasonSonarrAddText').textContent = 'Add to Sonarr';
    }

    // --- Season plot ---
    const plotSection = document.getElementById('seasonPlotSection');
    const plotText = document.getElementById('seasonPlotText');
    const plotMoreBtn = document.getElementById('seasonPlotMoreBtn');
    if (season.overview && season.overview.trim()) {
        plotText.textContent = season.overview;
        plotText.classList.remove('expanded');
        plotSection.style.display = 'block';
        // Check if text is clamped (needs "More" button)
        requestAnimationFrame(() => {
            if (plotText.scrollHeight > plotText.clientHeight + 2) {
                plotMoreBtn.style.display = 'inline-block';
                plotMoreBtn.textContent = 'More';
            } else {
                plotMoreBtn.style.display = 'none';
            }
        });
    } else {
        plotSection.style.display = 'none';
    }

    // --- Episodes header ---
    document.getElementById('seasonEpisodesHeader').textContent =
        `${totalEpisodes} Episode${totalEpisodes !== 1 ? 's' : ''}`;

    // --- Populate episodes (with overview) ---
    const container = document.getElementById('seasonEpisodesContainer');
    container.innerHTML = '';

    episodes.forEach(episode => {
        const episodeKey = `s${seasonNum}e${episode.episode_number}`;
        const ownershipData = (typeof episodeOwnership !== 'undefined') ? (episodeOwnership[episodeKey] || {}) : {};
        const isOwned = ownershipData.owned || false;

        const enrichedEpisode = {
            ...episode,
            rating_key: ownershipData.rating_key || null,
            runtime: ownershipData.runtime || episode.runtime || null
        };

        const episodeItem = document.createElement('div');
        episodeItem.className = `season-episode-item ${isOwned ? 'owned' : ''}`;

        // Episode thumbnail with overlays
        let thumbnailHTML = '';
        if (episode.still_path) {
            const episodeNum = String(episode.episode_number).padStart(2, '0');
            thumbnailHTML = `
                <div class="episode-thumbnail">
                    <img src="https://image.tmdb.org/t/p/w300${episode.still_path}"
                         alt="Episode ${episode.episode_number}"
                         onerror="this.parentElement.style.display='none'">
                    <div class="episode-number-overlay">E${episodeNum}</div>
                    <div class="episode-owned-badge ${isOwned ? 'owned' : 'not-owned'}"></div>
                </div>
            `;
        }

        // Episode overview (2-line clamped)
        const overviewHTML = episode.overview
            ? `<div class="episode-overview">${episode.overview}</div>`
            : '';

        const episodeHTML = `
            ${thumbnailHTML}
            <div class="episode-info-container">
                <div class="episode-title">${episode.name || `Episode ${episode.episode_number}`}</div>
                ${episode.air_date ? `<div class="episode-air-date">${formatDate(episode.air_date)}</div>` : ''}
                ${overviewHTML}
            </div>
        `;

        episodeItem.innerHTML = episodeHTML;

        // Make episode clickable
        episodeItem.style.cursor = 'pointer';
        episodeItem.addEventListener('click', function(e) {
            openEpisodeModal(enrichedEpisode, seasonNum, isOwned);
        });

        container.appendChild(episodeItem);
    });

    // --- Close sources modal if lingering ---
    document.getElementById('seasonSourcesModal').style.display = 'none';

    // --- Show modal ---
    document.getElementById('seasonModal').style.display = 'block';
    document.body.classList.add('season-modal-open');

    // Scroll to top
    const modalOverlay = document.querySelector('.season-modal-overlay');
    modalOverlay.scrollTop = 0;

    // --- Fetch UltraBlur colors ---
    fetchSeasonUltraBlurColors();
}

function closeSeasonModal() {

    // Close main modal

// --- UltraBlur Functions (mirror TV modal pattern) ---
async function fetchSeasonUltraBlurColors() {
    if (!window.currentTvShow) return;

    const ratingKey = window.currentTvShow.rating_key;
    const tmdbId = window.currentTvShow.tmdb_id || window.currentTvShow.id;
    if (!ratingKey && !tmdbId) return;

    try {
        const url = ratingKey
            ? `/api/plex/ultrablur/${ratingKey}`
            : `/api/plex/ultrablur/resolve?tmdb_id=${tmdbId}`;
        const resp = await fetch(url);
        if (!resp.ok) return;
        const colors = await resp.json();
        if (!colors.topLeft && !colors.topRight && !colors.bottomRight && !colors.bottomLeft) return;
        applySeasonUltraBlurColors(colors);
    } catch (e) {
        // Non-critical
    }
}

function applySeasonUltraBlurColors(colors) {
    const tl = colors.topLeft || '#1a1a1a';
    const tr = colors.topRight || '#1a1a1a';
    const br = colors.bottomRight || '#0f0f0f';
    const bl = colors.bottomLeft || '#0f0f0f';

    const overlay = document.querySelector('#seasonModal .season-modal-overlay');
    const mockup = overlay ? overlay.querySelector('.season-mockup') : null;
    const backdropSection = overlay ? overlay.querySelector('.season-backdrop-section') : null;

    if (overlay) {
        overlay.style.backgroundColor = '#0a0a0a';
        overlay.style.backgroundImage = [
            `radial-gradient(circle at 0% 0%, ${tl}, transparent 70%)`,
            `radial-gradient(circle at 100% 0%, ${tr}, transparent 70%)`,
            `radial-gradient(circle at 100% 100%, ${br}, transparent 70%)`,
            `radial-gradient(circle at 0% 100%, ${bl}, transparent 70%)`,
        ].join(', ');
    }
    if (mockup) {
        mockup.style.background = 'none';
    }
    if (backdropSection) {
        backdropSection.style.webkitMaskImage = 'linear-gradient(to bottom, black 20%, transparent 100%)';
        backdropSection.style.maskImage = 'linear-gradient(to bottom, black 20%, transparent 100%)';
    }
}

function resetSeasonUltraBlurColors() {
    const overlay = document.querySelector('#seasonModal .season-modal-overlay');
    const mockup = overlay ? overlay.querySelector('.season-mockup') : null;
    const backdropSection = overlay ? overlay.querySelector('.season-backdrop-section') : null;

    if (overlay) {
        overlay.style.backgroundColor = '';
        overlay.style.backgroundImage = '';
    }
    if (mockup) {
        mockup.style.background = '';
    }
    if (backdropSection) {
        backdropSection.style.webkitMaskImage = '';
        backdropSection.style.maskImage = '';
    }
}

// --- Watch Season ---
async function handleWatchSeason() {
    try {
        if (!currentSeasonData || !window.currentTvShow) {
            throw new Error('Season or show data not available');
        }

        const title = window.currentTvShow.title || window.currentTvShow.name;
        const year = window.currentTvShow.year || window.currentTvShow.first_air_date?.substring(0, 4);
        const season = currentSeasonData.season_number;

        console.log('Starting playback for season:', title, `S${season} - Episode 1`);

        // Get the show's rating key from Plex
        const showResponse = await fetch(`/api/tv/show?title=${encodeURIComponent(title)}&year=${year || ''}`);
        if (!showResponse.ok) {
            throw new Error('Show not found in Plex library');
        }

        const showData = await showResponse.json();
        if (!showData.success || !showData.show) {
            throw new Error('Show not found in Plex library');
        }

        const showRatingKey = showData.show.rating_key;

        // Get the first episode of the season
        const episodeResponse = await fetch(`/api/tv/episodes?show_rating_key=${showRatingKey}&season=${season}&episode=1`);
        if (!episodeResponse.ok) {
            throw new Error(`Episode S${season}E01 not found in Plex`);
        }

        const episodeData = await episodeResponse.json();
        if (!episodeData.success || !episodeData.episode) {
            throw new Error(`Episode S${season}E01 not found in Plex`);
        }

        const episodeInfo = episodeData.episode;

        const episodeForPlayback = {
            title: `${title} - S${String(season).padStart(2, '0')}E01: ${episodeInfo.episode_title || 'Episode 1'}`,
            rating_key: episodeInfo.rating_key,
            libraries: episodeInfo.libraries || [],
            library_keys: episodeInfo.library_keys || {},
            backdrop_url: window.currentTvShow.backdrop_url || (window.currentTvShow.backdrop_path ? `https://image.tmdb.org/t/p/original${window.currentTvShow.backdrop_path}` : ''),
            clearlogo_url: window.currentTvShow.clearlogo_url || ''
        };

        if (typeof window.showLibrarySelectionModal === 'function') {
            window.showLibrarySelectionModal(episodeForPlayback);
        } else {
            alert('Playback function not available. Please refresh the page.');
        }

    } catch (error) {
        console.error('Error playing season:', error);
        alert(error.message || 'Failed to start playback');
    }
}

// --- Add to Sonarr (for unowned seasons) ---
async function addSeasonToSonarr() {
    if (!window.currentTvShow) {
        alert('Show data not available');
        return;
    }

    const tvdbId = window.currentTvShow.tvdb_id;
    const tmdbId = window.currentTvShow.tmdb_id || window.currentTvShow.id;
    if (!tvdbId && !tmdbId) {
        alert('Unable to add to Sonarr: Missing TVDB/TMDB ID');
        return;
    }

    const actionButton = document.getElementById('seasonSonarrAddButton');
    const actionIcon = document.getElementById('seasonSonarrAddIcon');
    const actionText = document.getElementById('seasonSonarrAddText');

    // Disable button and show spinner
    actionButton.disabled = true;
    actionIcon.className = 'fas fa-circle-notch fa-spin';
    actionText.textContent = 'Adding...';

    try {
        const response = await fetch('/api/sonarr/add', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                tvdb_id: tvdbId,
                tmdb_id: tmdbId,
                title: window.currentTvShow.title || window.currentTvShow.name,
                monitor: 'all',
                quality_profile_id: 7,
                search_missing: false
            })
        });

        const result = await response.json();

        if (response.ok && result.success) {
            actionIcon.className = 'fas fa-check';
            actionText.textContent = 'Added to Sonarr!';
            actionButton.className = 'season-sonarr-add-button success';

            setTimeout(() => {
                actionButton.style.display = 'none';
            }, 2000);
        } else {
            actionIcon.className = 'fas fa-times';
            actionText.textContent = result.message || 'Failed to add';
            actionButton.className = 'season-sonarr-add-button error';

            setTimeout(() => {
                actionIcon.className = 'fas fa-plus';
                actionText.textContent = 'Add to Sonarr';
                actionButton.className = 'season-sonarr-add-button';
                actionButton.disabled = false;
            }, 3000);
        }
    } catch (error) {
        console.error('Error adding to Sonarr:', error);

        actionIcon.className = 'fas fa-times';
        actionText.textContent = 'Error';
        actionButton.className = 'season-sonarr-add-button error';

        setTimeout(() => {
            actionIcon.className = 'fas fa-plus';
            actionText.textContent = 'Add to Sonarr';
            actionButton.className = 'season-sonarr-add-button';
            actionButton.disabled = false;
        }, 3000);
    }
}

// --- Search for Season Releases (targets Sources modal) ---
async function searchForSeason() {
    if (!currentSeasonData || !window.currentTvShow) {
        console.warn('Season data not available');
        return;
    }

    const searchLoading = document.getElementById('seasonSearchLoading');
    const searchResults = document.getElementById('seasonSourcesContent');
    const searchEmpty = document.getElementById('seasonSearchEmpty');

    // Show loading
    searchLoading.style.display = 'block';
    searchResults.innerHTML = '';
    searchEmpty.style.display = 'none';

    try {
        const tvdbId = window.currentTvShow.tvdb_id;
        const seasonNumber = currentSeasonData.season_number;

        if (!tvdbId) {
            throw new Error('TVDB ID not available');
        }

        // Check if show is in Sonarr
        let showInSonarr = false;
        try {
            const tmdbId = window.currentTvShow.id || window.currentTvShow.tmdb_id;
            const url = `/api/sonarr/status/${tvdbId}` +
                       (tmdbId ? `?tmdb_id=${tmdbId}` : '');
            const sonarrResponse = await fetch(url);
            const sonarrData = await sonarrResponse.json();
            showInSonarr = sonarrData.exists || false;
        } catch (e) {
            console.log('Could not check Sonarr status:', e);
        }

        // Search for season releases
        const tmdbId = window.currentTvShow.id || window.currentTvShow.tmdb_id;
        const searchUrl = `/api/sonarr/season/search?tvdb_id=${tvdbId}&season=${seasonNumber}` +
                         (tmdbId ? `&tmdb_id=${tmdbId}` : '');

        console.log('Searching for season releases:', searchUrl);
        const response = await fetch(searchUrl);
        const data = await response.json();

        searchLoading.style.display = 'none';

        if (response.ok && data.success && data.releases && data.releases.length > 0) {
            window.currentSeasonReleases = data.releases;
            window.currentSeasonContext = {
                series_id: data.series_id,
                season: data.season
            };

            displaySeasonReleases(data.releases);
        } else if (response.status === 404 && !showInSonarr) {
            searchEmpty.style.display = 'block';
            searchEmpty.innerHTML = `
                <div style="color: rgba(255,255,255,0.7); line-height: 1.6;">
                    <i class="fas fa-info-circle" style="color: #3b82f6; font-size: 24px; margin-bottom: 10px; display: block;"></i>
                    <strong>Show Not In Sonarr</strong><br>
                    This show needs to be added to Sonarr before you can search for releases.<br><br>
                    Please go back and click "Add to Sonarr" on the show page first.
                </div>
            `;
        } else {
            searchEmpty.style.display = 'block';
            searchEmpty.textContent = 'No releases found for this season';
        }

    } catch (error) {
        console.error('Error searching for season:', error);
        searchLoading.style.display = 'none';

        searchEmpty.style.display = 'block';
        searchEmpty.innerHTML = `
            <div style="color: #ef4444;">
                <i class="fas fa-exclamation-triangle" style="font-size: 24px; margin-bottom: 10px; display: block;"></i>
                <strong>Search Failed</strong><br>
                ${error.message || 'Failed to search for season'}
            </div>
        `;
    }
}

function formatUploadDate(dateStr, ageMinutes) {
    if (ageMinutes !== undefined && ageMinutes !== null) {
        const days = Math.floor(ageMinutes / (60 * 24));
        if (days === 0) return 'Today';
        if (days === 1) return '1d ago';
        if (days < 7) return `${days}d ago`;
        if (days < 30) {
            const weeks = Math.floor(days / 7);
            return `${weeks}w ago`;
        }
        if (days < 365) {
            const months = Math.floor(days / 30);
            return `${months}mo ago`;
        }
        const years = Math.floor(days / 365);
        return `${years}y ago`;
    }

    if (!dateStr) return null;
    try {
        let normalizedDate = dateStr;
        if (dateStr.match(/^\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}/)) {
            normalizedDate = dateStr.replace(' ', 'T');
        }
        const date = new Date(normalizedDate);
        if (isNaN(date.getTime())) return null;

        const now = new Date();
        const diffMs = now - date;
        const diffDays = Math.floor(diffMs / (1000 * 60 * 60 * 24));

        if (diffDays === 0) return 'Today';
        if (diffDays === 1) return '1d ago';
        if (diffDays < 7) return `${diffDays}d ago`;
        if (diffDays < 30) {
            const weeks = Math.floor(diffDays / 7);
            return `${weeks}w ago`;
        }
        if (diffDays < 365) {
            const months = Math.floor(diffDays / 30);
            return `${months}mo ago`;
        }
        const monthNames = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun',
                           'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
        return `${monthNames[date.getMonth()]} ${date.getFullYear()}`;
    } catch (e) {
        return null;
    }
}

function displaySeasonReleases(releases) {
    const searchResults = document.getElementById('seasonSourcesContent');
    searchResults.innerHTML = '';

    function getQuality(release) {
        if (release.quality && release.quality.quality && release.quality.quality.name) {
            const qualityName = release.quality.quality.name;
            if (qualityName.includes('2160') || qualityName.toLowerCase().includes('uhd')) return '2160p';
            if (qualityName.includes('1080')) return '1080p';
            if (qualityName.includes('720')) return '720p';
            if (qualityName.includes('480')) return '480p';
        }
        const title = (release.title || '').toUpperCase();
        if (title.includes('2160P') || title.includes('4K') || title.includes('UHD')) return '2160p';
        if (title.includes('1080P')) return '1080p';
        if (title.includes('720P')) return '720p';
        if (title.includes('480P')) return '480p';
        return 'Other';
    }

    function getSourceType(release) {
        const title = (release.title || '').toUpperCase();
        if (title.includes('REMUX')) return 'REMUX';
        if (title.includes('WEB')) return 'WEB-DL';
        if (title.includes('BLURAY') || title.includes('BLU-RAY') || title.includes('BDRIP') || title.includes('BD')) return 'BluRay';
        return 'Encode';
    }

    const qualityGroups = {};
    const qualityOrder = ['2160p', '1080p', '720p', '480p', 'Other'];

    releases.forEach(release => {
        const quality = getQuality(release);
        if (!qualityGroups[quality]) qualityGroups[quality] = {};
        const source = getSourceType(release);
        if (!qualityGroups[quality][source]) qualityGroups[quality][source] = [];
        qualityGroups[quality][source].push(release);
    });

    qualityOrder.forEach(quality => {
        if (!qualityGroups[quality]) return;

        const qualitySegment = document.createElement('div');
        qualitySegment.className = 'quality-segment collapsed';

        const qualityHeader = document.createElement('div');
        qualityHeader.className = 'quality-segment-header collapsed';

        const leftSide = document.createElement('div');
        leftSide.style.display = 'flex';
        leftSide.style.alignItems = 'center';
        leftSide.style.gap = '12px';

        const qualityText = document.createElement('span');
        qualityText.className = 'quality-text';
        qualityText.textContent = quality;

        const totalCount = Object.values(qualityGroups[quality]).reduce((sum, items) => sum + items.length, 0);
        const qualityCount = document.createElement('span');
        qualityCount.className = 'quality-count';
        qualityCount.textContent = `${totalCount} ${totalCount === 1 ? 'release' : 'releases'}`;

        leftSide.appendChild(qualityText);
        leftSide.appendChild(qualityCount);

        const expandIcon = document.createElement('i');
        expandIcon.className = 'fas fa-chevron-down expand-icon';

        qualityHeader.appendChild(leftSide);
        qualityHeader.appendChild(expandIcon);

        qualityHeader.addEventListener('click', function() {
            qualitySegment.classList.toggle('collapsed');
            qualityHeader.classList.toggle('collapsed');
            qualityHeader.classList.toggle('expanded');
        });

        const sourceItems = document.createElement('div');
        sourceItems.className = 'source-items';

        const sourceOrder = ['REMUX', 'WEB-DL', 'WEBRip', 'BluRay', 'Encode'];
        sourceOrder.forEach(source => {
            if (!qualityGroups[quality][source]) return;

            const sourceReleases = qualityGroups[quality][source].sort((a, b) => {
                const ageA = a.ageMinutes || a.age * 24 * 60 || Infinity;
                const ageB = b.ageMinutes || b.age * 24 * 60 || Infinity;
                return ageA - ageB;
            });

            const sourceTypeHeader = document.createElement('div');
            sourceTypeHeader.className = 'quality-section-header collapsed';
            sourceTypeHeader.innerHTML = `
                <span class="quality-type">${source}</span>
                <i class="fas fa-chevron-down source-expand-icon"></i>
            `;
            sourceTypeHeader.style.cursor = 'pointer';

            const sourceReleasesDiv = document.createElement('div');
            sourceReleasesDiv.className = 'source-torrents-list';
            sourceReleasesDiv.style.display = 'none';

            sourceReleases.forEach((release) => {
                const releaseIndex = releases.indexOf(release);
                const releaseItem = createSeasonReleaseElement(release, releaseIndex);
                sourceReleasesDiv.appendChild(releaseItem);
            });

            sourceTypeHeader.addEventListener('click', function(e) {
                e.stopPropagation();
                sourceTypeHeader.classList.toggle('collapsed');
                sourceTypeHeader.classList.toggle('expanded');
                sourceReleasesDiv.style.display = sourceReleasesDiv.style.display === 'none' ? 'block' : 'none';
            });

            sourceItems.appendChild(sourceTypeHeader);
            sourceItems.appendChild(sourceReleasesDiv);
        });

        qualitySegment.appendChild(qualityHeader);
        qualitySegment.appendChild(sourceItems);
        searchResults.appendChild(qualitySegment);
    });
}

function createSeasonReleaseElement(release, index) {
    const sourceItem = document.createElement('div');
    sourceItem.className = 'source-item';

    const sourceInfo = document.createElement('div');
    sourceInfo.className = 'source-info';

    const sourceName = document.createElement('div');
    sourceName.className = 'source-name';

    const trackerBadge = document.createElement('span');
    const indexerName = (release.indexer || 'Unknown').toLowerCase();
    trackerBadge.className = `tracker-badge ${indexerName}`;
    const trackerMap = {
        'beyondhd': 'BHD',
        'morethantv': 'MTV',
        'privatehd': 'PHD',
        'iptorrents': 'IPT'
    };
    trackerBadge.textContent = trackerMap[indexerName] || release.indexer || 'Unknown';

    const titleSpan = document.createElement('span');
    titleSpan.style.flex = '1';
    titleSpan.style.minWidth = '0';
    titleSpan.style.wordBreak = 'break-word';
    titleSpan.style.overflowWrap = 'break-word';
    titleSpan.textContent = release.title || 'Unknown Release';

    sourceName.appendChild(trackerBadge);
    sourceName.appendChild(titleSpan);

    const sourceMeta = document.createElement('div');
    sourceMeta.className = 'source-meta';

    const sizeGB = (release.size / (1024 * 1024 * 1024)).toFixed(2);
    const sizeSpan = document.createElement('span');
    sizeSpan.textContent = `${sizeGB} GB`;

    const seedersSpan = document.createElement('span');
    seedersSpan.style.color = '#10b981';
    seedersSpan.textContent = `${release.seeders || 0} seeders`;

    sourceMeta.appendChild(sizeSpan);
    sourceMeta.appendChild(seedersSpan);

    const uploadDate = formatUploadDate(release.publishDate, release.ageMinutes);
    if (uploadDate) {
        const dateSpan = document.createElement('span');
        dateSpan.style.color = '#9ca3af';
        dateSpan.textContent = uploadDate;
        sourceMeta.appendChild(dateSpan);
    }

    sourceInfo.appendChild(sourceName);
    sourceInfo.appendChild(sourceMeta);

    const downloadBtn = document.createElement('button');
    downloadBtn.className = 'download-btn';
    downloadBtn.innerHTML = '<i class="fas fa-download"></i>';
    downloadBtn.onclick = (e) => {
        e.stopPropagation();
        downloadSeasonRelease(index, downloadBtn);
    };

    sourceItem.appendChild(sourceInfo);
    sourceItem.appendChild(downloadBtn);

    return sourceItem;
}

async function downloadSeasonRelease(index, downloadBtn) {
    const releases = window.currentSeasonReleases;
    const context = window.currentSeasonContext || {};
    if (!releases || !releases[index]) {
        alert('Release not found');
        return;
    }

    const release = releases[index];

    downloadBtn.disabled = true;
    downloadBtn.innerHTML = '<i class="fas fa-circle-notch fa-spin"></i>';

    try {
        const response = await fetch('/api/sonarr/episode/download', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                guid: release.guid,
                indexer_id: release.indexerId,
                series_id: context.series_id,
                season: context.season
            })
        });

        const data = await response.json();

        if (response.ok && data.success) {
            downloadBtn.style.background = '#22c55e';
            downloadBtn.style.borderColor = '#22c55e';
            downloadBtn.innerHTML = '<i class="fas fa-check"></i>';

            setTimeout(() => {
                downloadBtn.style.background = '';
                downloadBtn.style.borderColor = '';
                downloadBtn.innerHTML = '<i class="fas fa-download"></i>';
                downloadBtn.disabled = false;
            }, 2000);
        } else {
            throw new Error(data.message || 'Failed to download release');
        }
    } catch (error) {
        console.error('Error downloading release:', error);

        downloadBtn.style.background = '#ef4444';
        downloadBtn.style.borderColor = '#ef4444';
        downloadBtn.innerHTML = '<i class="fas fa-times"></i>';

        alert(error.message || 'Failed to download release');

        setTimeout(() => {
            downloadBtn.style.background = '';
            downloadBtn.style.borderColor = '';
            downloadBtn.innerHTML = '<i class="fas fa-download"></i>';
            downloadBtn.disabled = false;
        }, 2000);
    }
}

// Close modal on escape key
document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape' && document.getElementById('seasonModal').style.display === 'block') {
        // Close sources first if open, otherwise close season modal
        if (document.getElementById('seasonSourcesModal').style.display === 'flex') {
            closeSeasonSourcesModal();
        } else {
            closeSeasonModal();
        }
    }
});
</script>
