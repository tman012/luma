<script>
// Episode Modal Functions
let currentEpisodeData = null;
let currentShowId = null;
let episodeSourcesLoaded = false;

function toggleEpisodePlot() {
    const plotText = document.getElementById('episodeModalOverview');
    const plotMoreBtn = document.getElementById('episodeMoreButton');

    if (plotText.classList.contains('expanded')) {
        plotText.classList.remove('expanded');
        plotMoreBtn.textContent = 'More';
    } else {
        plotText.classList.add('expanded');
        plotMoreBtn.textContent = 'Less';
    }
}

function openEpisodeModal(episode, seasonNumber, isOwned) {
    console.log('Opening episode modal for:', episode, 'Season:', seasonNumber, 'Owned:', isOwned);
    console.log('currentTvShow at modal open:', window.currentTvShow);

    currentEpisodeData = episode;
    currentEpisodeData.season_number = seasonNumber;
    currentEpisodeData.is_owned = isOwned;
    episodeSourcesLoaded = false;

    // Reset UltraBlur
    resetEpisodeUltraBlurColors();

    // --- Backdrop image (show's backdrop) ---
    const backdropImg = document.getElementById('episodeModalBackdropImage');
    const backdropUrl = window.currentTvShow ? (window.currentTvShow.backdrop_url || '') : '';
    if (backdropUrl) {
        backdropImg.src = backdropUrl;
        backdropImg.onload = function() { backdropImg.style.opacity = '1'; };
        backdropImg.onerror = function() { backdropImg.style.opacity = '0'; };
    } else if (episode.still_path) {
        backdropImg.src = `https://image.tmdb.org/t/p/w780${episode.still_path}`;
        backdropImg.onload = function() { backdropImg.style.opacity = '1'; };
        backdropImg.onerror = function() { backdropImg.style.opacity = '0'; };
    } else {
        backdropImg.src = '';
        backdropImg.style.opacity = '0';
    }

    // --- Clearlogo or fallback title ---
    const clearlogoImg = document.getElementById('episodeShowClearlogo');
    const clearlogoFallback = document.getElementById('episodeShowTitle');
    const clearlogoUrl = window.currentTvShow ? (window.currentTvShow.clearlogo_url || '') : '';

    if (clearlogoUrl) {
        clearlogoImg.src = clearlogoUrl;
        clearlogoImg.style.display = 'block';
        clearlogoFallback.style.display = 'none';
    } else {
        clearlogoImg.style.display = 'none';
        clearlogoFallback.textContent = window.currentTvShow?.title || 'Unknown Show';
        clearlogoFallback.style.display = 'block';
    }

    // --- Episode title (directly beneath clearlogo) ---
    document.getElementById('episodeModalTitle').textContent = episode.name || `Episode ${episode.episode_number}`;

    // --- Single meta line: S01 · E05 · date · runtime · MPAA ---
    const metaLine = document.getElementById('episodeMetaLine');
    metaLine.innerHTML = '';

    // S/E
    const seSpan = document.createElement('span');
    seSpan.textContent = `S${String(seasonNumber).padStart(2, '0')} \u00b7 E${String(episode.episode_number).padStart(2, '0')}`;
    metaLine.appendChild(seSpan);

    // Air date
    let airDate = '';
    if (episode.air_date) {
        try {
            if (!isNaN(episode.air_date)) {
                airDate = new Date(episode.air_date * 1000).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
            } else {
                airDate = new Date(episode.air_date).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
            }
            if (airDate === 'Invalid Date') airDate = '';
        } catch (e) {
            airDate = '';
        }
    }
    if (airDate) {
        const dateSpan = document.createElement('span');
        dateSpan.textContent = airDate;
        metaLine.appendChild(dateSpan);
    }

    // Runtime
    if (episode.runtime) {
        const rtSpan = document.createElement('span');
        rtSpan.textContent = `${episode.runtime}m`;
        metaLine.appendChild(rtSpan);
    }

    // MPAA / Content rating (from show)
    const contentRating = window.currentTvShow?.content_rating || window.currentTvShow?.contentRating || '';
    if (contentRating) {
        const ratingSpan = document.createElement('span');
        ratingSpan.textContent = contentRating;
        metaLine.appendChild(ratingSpan);
    }

    // --- Plot with More/Less ---
    const plotText = document.getElementById('episodeModalOverview');
    const plotMoreBtn = document.getElementById('episodeMoreButton');
    const overviewText = episode.overview || 'No overview available.';

    plotText.textContent = overviewText;
    plotText.classList.remove('expanded');

    setTimeout(() => {
        if (plotText.scrollHeight > plotText.clientHeight) {
            plotMoreBtn.style.display = 'inline-block';
            plotMoreBtn.textContent = 'More';
        } else {
            plotMoreBtn.style.display = 'none';
        }
    }, 0);

    // --- Primary action button (white pill, owned only) ---
    const primaryButton = document.getElementById('episodePrimaryButton');
    if (isOwned && episode.rating_key) {
        primaryButton.style.display = 'flex';
        primaryButton.innerHTML = '<i class="fas fa-play"></i><span>Play Episode</span>';
    } else {
        primaryButton.style.display = 'none';
    }

    // --- Show action buttons row (always visible) ---
    document.getElementById('episodeActionButtonsRow').style.display = 'flex';

    // --- Cast & Crew ---
    populateEpisodeCastCrew(episode);

    // --- Show modal ---
    const episodeModal = document.getElementById('episodeModal');
    episodeModal.style.display = 'block';
    document.body.classList.add('episode-modal-open');

    // Scroll to top
    const modalOverlay = episodeModal.querySelector('.episode-modal-overlay');
    if (modalOverlay) {
        modalOverlay.scrollTop = 0;
    }

    // Fetch UltraBlur colors
    fetchEpisodeUltraBlurColors();
}

function populateEpisodeCastCrew(episode) {
    const castSection = document.getElementById('episodeCastSection');
    const castScroll = document.getElementById('episodeCastScroll');
    castScroll.innerHTML = '';

    const guestStars = episode.guest_stars || [];
    const crew = episode.crew || [];

    // Dedupe crew: only keep Director, Writer, and key roles
    const keyJobs = ['Director', 'Writer', 'Teleplay', 'Story', 'Screenplay'];
    const keyCrew = crew.filter(c => keyJobs.includes(c.job));

    // Build combined list: key crew first, then guest stars
    const people = [];
    const seenIds = new Set();

    for (const c of keyCrew) {
        if (c.id && !seenIds.has(c.id)) {
            seenIds.add(c.id);
            people.push({ name: c.name, role: c.job, profile_path: c.profile_path });
        }
    }
    for (const gs of guestStars) {
        if (gs.id && !seenIds.has(gs.id)) {
            seenIds.add(gs.id);
            people.push({ name: gs.name, role: gs.character, profile_path: gs.profile_path });
        }
    }

    if (people.length === 0) {
        castSection.style.display = 'none';
        return;
    }

    castSection.style.display = 'block';

    people.forEach(person => {
        const card = document.createElement('div');
        card.className = 'ep-cast-card';

        if (person.profile_path) {
            const img = document.createElement('img');
            img.className = 'ep-cast-photo';
            img.src = `https://image.tmdb.org/t/p/w185${person.profile_path}`;
            img.alt = person.name;
            img.loading = 'lazy';
            img.onerror = function() {
                // Replace with placeholder on error
                const ph = document.createElement('div');
                ph.className = 'ep-cast-photo-placeholder';
                ph.innerHTML = '<i class="fas fa-user"></i>';
                this.replaceWith(ph);
            };
            card.appendChild(img);
        } else {
            const ph = document.createElement('div');
            ph.className = 'ep-cast-photo-placeholder';
            ph.innerHTML = '<i class="fas fa-user"></i>';
            card.appendChild(ph);
        }

        const nameDiv = document.createElement('div');
        nameDiv.className = 'ep-cast-name';
        nameDiv.textContent = person.name;
        card.appendChild(nameDiv);

        if (person.role) {
            const roleDiv = document.createElement('div');
            roleDiv.className = 'ep-cast-role';
            roleDiv.textContent = person.role;
            card.appendChild(roleDiv);
        }

        castScroll.appendChild(card);
    });
}

function closeEpisodeModal() {
    // Close sources modal if open
    document.getElementById('episodeSourcesModal').style.display = 'none';

    // Close main modal
    const episodeModal = document.getElementById('episodeModal');
    episodeModal.style.display = 'none';
    document.body.classList.remove('episode-modal-open');

    // Reset UltraBlur
    resetEpisodeUltraBlurColors();

    // Clear episode data
    currentEpisodeData = null;
    episodeSourcesLoaded = false;
}

// --- UltraBlur Functions (mirror season modal pattern) ---
async function fetchEpisodeUltraBlurColors() {
    if (!window.currentTvShow) return;

    const ratingKey = window.currentTvShow.rating_key;
    const tmdbId = window.currentTvShow.tmdb_id || window.currentTvShow.id;
    if (!ratingKey && !tmdbId) return;

    try {
        const url = ratingKey
            ? `/api/plex/ultrablur/${ratingKey}`
            : `/api/plex/ultrablur/resolve?tmdb_id=${tmdbId}`;
        const resp = await fetch(url);
        if (!resp.ok) return;
        const colors = await resp.json();
        if (!colors.topLeft && !colors.topRight && !colors.bottomRight && !colors.bottomLeft) return;
        applyEpisodeUltraBlurColors(colors);
    } catch (e) {
        // Non-critical
    }
}

function applyEpisodeUltraBlurColors(colors) {
    const tl = colors.topLeft || '#1a1a1a';
    const tr = colors.topRight || '#1a1a1a';
    const br = colors.bottomRight || '#0f0f0f';
    const bl = colors.bottomLeft || '#0f0f0f';

    const overlay = document.querySelector('#episodeModal .episode-modal-overlay');
    const mockup = overlay ? overlay.querySelector('.ep-mockup') : null;
    const backdropSection = overlay ? overlay.querySelector('.ep-backdrop-section') : null;

    if (overlay) {
        overlay.style.backgroundColor = '#0a0a0a';
        overlay.style.backgroundImage = [
            `radial-gradient(circle at 0% 0%, ${tl}, transparent 70%)`,
            `radial-gradient(circle at 100% 0%, ${tr}, transparent 70%)`,
            `radial-gradient(circle at 100% 100%, ${br}, transparent 70%)`,
            `radial-gradient(circle at 0% 100%, ${bl}, transparent 70%)`,
        ].join(', ');
    }
    if (mockup) {
        mockup.style.background = 'none';
    }
    if (backdropSection) {
        backdropSection.style.webkitMaskImage = 'linear-gradient(to bottom, black 20%, transparent 100%)';
        backdropSection.style.maskImage = 'linear-gradient(to bottom, black 20%, transparent 100%)';
    }
}

function resetEpisodeUltraBlurColors() {
    const overlay = document.querySelector('#episodeModal .episode-modal-overlay');
    const mockup = overlay ? overlay.querySelector('.ep-mockup') : null;
    const backdropSection = overlay ? overlay.querySelector('.ep-backdrop-section') : null;

    if (overlay) {
        overlay.style.backgroundColor = '';
        overlay.style.backgroundImage = '';
    }
    if (mockup) {
        mockup.style.background = '';
    }
    if (backdropSection) {
        backdropSection.style.webkitMaskImage = '';
        backdropSection.style.maskImage = '';
    }
}

// --- Sources Modal Functions ---
function openEpisodeSourcesModal() {
    const sourcesModal = document.getElementById('episodeSourcesModal');
    sourcesModal.style.display = 'flex';

    if (!episodeSourcesLoaded) {
        episodeSourcesLoaded = true;
        searchEpisode();
    }
}

function closeEpisodeSourcesModal() {
    document.getElementById('episodeSourcesModal').style.display = 'none';
}

// --- Primary Action ---
async function handleEpisodePrimaryAction() {
    await handleWatchEpisode();
}

async function handleWatchEpisode() {
    try {
        if (!currentEpisodeData || !window.currentTvShow) {
            throw new Error('Episode or show data not available');
        }

        const title = window.currentTvShow.title || window.currentTvShow.name;
        const season = currentEpisodeData.season_number;
        const episode = currentEpisodeData.episode_number;
        const episodeRatingKey = currentEpisodeData.rating_key;

        console.log('Starting playback for episode:', title, `S${season}E${episode}`, 'Rating Key:', episodeRatingKey);

        if (!episodeRatingKey) {
            throw new Error('Episode rating key not available');
        }

        const backdropUrl = window.currentTvShow.backdrop_url ||
                           (window.currentTvShow.backdrop_path ? `https://image.tmdb.org/t/p/w1280${window.currentTvShow.backdrop_path}` : null);
        const clearlogoUrl = window.currentTvShow.clearlogo_url || null;

        const response = await fetch(`/api/plex/episode_libraries/${episodeRatingKey}`);
        const data = await response.json();

        if (data.owned && data.libraries && data.libraries.length > 0) {
            const episodeTitle = currentEpisodeData.name || `Episode ${episode}`;
            window.showLibrarySelectionModal({
                title: `${title} - S${String(season).padStart(2, '0')}E${String(episode).padStart(2, '0')}: ${episodeTitle}`,
                libraries: data.libraries,
                library_keys: data.library_keys,
                rating_key: episodeRatingKey,
                backdrop_url: backdropUrl,
                clearlogo_url: clearlogoUrl
            });
        } else {
            const episodeTitle = currentEpisodeData.name || `Episode ${episode}`;
            const fullTitle = `${title} - S${String(season).padStart(2, '0')}E${String(episode).padStart(2, '0')}: ${episodeTitle}`;

            window.showPlaybackModal(
                episodeRatingKey,
                fullTitle,
                'tv',
                backdropUrl,
                clearlogoUrl
            );
        }

    } catch (error) {
        console.error('Error playing episode:', error);
        alert(error.message || 'Failed to start playback');
    }
}

// --- Episode Search ---
async function searchEpisode() {
    const searchLoading = document.getElementById('episodeSearchLoading');
    const searchResults = document.getElementById('epSourcesContent');
    const searchEmpty = document.getElementById('episodeSearchEmpty');

    searchLoading.style.display = 'block';
    searchResults.innerHTML = '';
    searchEmpty.style.display = 'none';

    try {
        const tvdbId = window.currentTvShow.tvdb_id;

        if (!tvdbId) {
            throw new Error('TVDB ID not available for this show');
        }

        console.log('Searching for episode:', tvdbId, 'Season:', currentEpisodeData.season_number, 'Episode:', currentEpisodeData.episode_number);

        const response = await fetch(`/api/sonarr/episode/search?tvdb_id=${tvdbId}&season=${currentEpisodeData.season_number}&episode=${currentEpisodeData.episode_number}`);

        const data = await response.json();

        console.log('Episode search response:', data);

        searchLoading.style.display = 'none';

        if (response.ok && data.success) {
            if (data.releases && data.releases.length > 0) {
                window.currentEpisodeContext = {
                    episode_id: data.episode_id
                };
                displayEpisodeSearchResults(data.releases);
            } else {
                searchEmpty.style.display = 'block';
                searchEmpty.textContent = 'No releases found for this episode';
            }
        } else {
            searchEmpty.style.display = 'block';
            searchEmpty.textContent = data.message || 'Error searching for episode';

            if (response.status === 404 && data.message?.includes('not found in Sonarr')) {
                searchEmpty.innerHTML = `
                    <div style="color: rgba(255,255,255,0.7); line-height: 1.6;">
                        <i class="fas fa-info-circle" style="color: #3b82f6; margin-bottom: 10px; display: block; font-size: 32px;"></i>
                        <strong>Show Not In Sonarr</strong><br>
                        This show needs to be added to Sonarr before you can search for individual episodes.<br><br>
                        Please go back and click "Add to Sonarr" on the show page first.
                    </div>
                `;
            }
        }
    } catch (error) {
        console.error('Error searching for episode:', error);
        searchLoading.style.display = 'none';
        searchEmpty.style.display = 'block';
        searchEmpty.textContent = error.message || 'Error searching for releases';
    }
}

function formatUploadDate(dateStr, ageMinutes) {
    if (ageMinutes !== undefined && ageMinutes !== null) {
        const days = Math.floor(ageMinutes / (60 * 24));
        if (days === 0) return 'Today';
        if (days === 1) return '1d ago';
        if (days < 7) return `${days}d ago`;
        if (days < 30) {
            const weeks = Math.floor(days / 7);
            return `${weeks}w ago`;
        }
        if (days < 365) {
            const months = Math.floor(days / 30);
            return `${months}mo ago`;
        }
        const years = Math.floor(days / 365);
        return `${years}y ago`;
    }

    if (!dateStr) return null;
    try {
        let normalizedDate = dateStr;
        if (dateStr.match(/^\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}/)) {
            normalizedDate = dateStr.replace(' ', 'T');
        }
        const date = new Date(normalizedDate);
        if (isNaN(date.getTime())) return null;

        const now = new Date();
        const diffMs = now - date;
        const diffDays = Math.floor(diffMs / (1000 * 60 * 60 * 24));

        if (diffDays === 0) return 'Today';
        if (diffDays === 1) return '1d ago';
        if (diffDays < 7) return `${diffDays}d ago`;
        if (diffDays < 30) {
            const weeks = Math.floor(diffDays / 7);
            return `${weeks}w ago`;
        }
        if (diffDays < 365) {
            const months = Math.floor(diffDays / 30);
            return `${months}mo ago`;
        }
        const monthNames = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun',
                           'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
        return `${monthNames[date.getMonth()]} ${date.getFullYear()}`;
    } catch (e) {
        return null;
    }
}

function displayEpisodeSearchResults(releases) {
    const searchResults = document.getElementById('epSourcesContent');
    searchResults.innerHTML = '';

    window.currentEpisodeReleases = releases;

    function getQualityScore(release) {
        if (release.quality && release.quality.quality && release.quality.quality.name) {
            const qualityName = release.quality.quality.name;
            if (qualityName.includes('2160') || qualityName.toLowerCase().includes('uhd')) return 4;
            if (qualityName.includes('1080')) return 3;
            if (qualityName.includes('720')) return 2;
            if (qualityName.includes('480')) return 1;
        }

        const title = (release.title || '').toUpperCase();
        if (title.includes('2160P') || title.includes('4K') || title.includes('UHD')) return 4;
        if (title.includes('1080P')) return 3;
        if (title.includes('720P')) return 2;
        if (title.includes('480P')) return 1;
        return 0;
    }

    const sortedReleases = [...releases].sort((a, b) => {
        const qualityDiff = getQualityScore(b) - getQualityScore(a);
        if (qualityDiff !== 0) return qualityDiff;

        const ageA = a.ageMinutes || a.age * 24 * 60 || Infinity;
        const ageB = b.ageMinutes || b.age * 24 * 60 || Infinity;
        return ageA - ageB;
    });

    const releasesContainer = document.createElement('div');
    releasesContainer.style.display = 'flex';
    releasesContainer.style.flexDirection = 'column';
    releasesContainer.style.gap = '12px';
    releasesContainer.style.width = '100%';

    sortedReleases.forEach((release, index) => {
        const originalIndex = releases.indexOf(release);
        const releaseItem = createEpisodeReleaseElement(release, originalIndex);
        releasesContainer.appendChild(releaseItem);
    });

    searchResults.appendChild(releasesContainer);
}

function createEpisodeReleaseElement(release, index) {
    const sourceItem = document.createElement('div');
    sourceItem.className = 'source-item';

    const sourceInfo = document.createElement('div');
    sourceInfo.className = 'source-info';

    const sourceName = document.createElement('div');
    sourceName.className = 'source-name';

    const trackerBadge = document.createElement('span');
    const indexerName = (release.indexer || 'Unknown').toLowerCase();
    trackerBadge.className = `tracker-badge ${indexerName}`;

    const trackerMap = {
        'beyondhd': 'BHD',
        'morethantv': 'MTV',
        'privatehd': 'PHD',
        'iptorrents': 'IPT'
    };
    trackerBadge.textContent = trackerMap[indexerName] || release.indexer || 'Unknown';

    const titleSpan = document.createElement('span');
    titleSpan.style.flex = '1';
    titleSpan.style.minWidth = '0';
    titleSpan.style.wordBreak = 'break-word';
    titleSpan.style.overflowWrap = 'break-word';
    titleSpan.textContent = release.title || 'Unknown Release';

    sourceName.appendChild(trackerBadge);
    sourceName.appendChild(titleSpan);

    const sourceMeta = document.createElement('div');
    sourceMeta.className = 'source-meta';

    const sizeGB = (release.size / (1024 * 1024 * 1024)).toFixed(2);
    const sizeSpan = document.createElement('span');
    sizeSpan.textContent = `${sizeGB} GB`;

    const seedersSpan = document.createElement('span');
    seedersSpan.style.color = '#10b981';
    seedersSpan.textContent = `${release.seeders || 0} seeders`;

    sourceMeta.appendChild(sizeSpan);
    sourceMeta.appendChild(seedersSpan);

    const uploadDate = formatUploadDate(release.publishDate, release.ageMinutes);
    if (uploadDate) {
        const dateSpan = document.createElement('span');
        dateSpan.style.color = '#9ca3af';
        dateSpan.textContent = uploadDate;
        sourceMeta.appendChild(dateSpan);
    }

    sourceInfo.appendChild(sourceName);
    sourceInfo.appendChild(sourceMeta);

    const downloadBtn = document.createElement('button');
    downloadBtn.className = 'download-btn';
    downloadBtn.innerHTML = '<i class="fas fa-download"></i>';
    downloadBtn.onclick = (e) => {
        e.stopPropagation();
        downloadEpisodeRelease(index, downloadBtn);
    };

    sourceItem.appendChild(sourceInfo);
    sourceItem.appendChild(downloadBtn);

    return sourceItem;
}

async function downloadEpisodeRelease(index, downloadBtn) {
    const releases = window.currentEpisodeReleases;
    const context = window.currentEpisodeContext || {};
    if (!releases || !releases[index]) {
        alert('Release not found');
        return;
    }

    const release = releases[index];

    downloadBtn.disabled = true;
    downloadBtn.innerHTML = '<i class="fas fa-circle-notch fa-spin"></i>';

    try {
        const response = await fetch('/api/sonarr/episode/download', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({
                guid: release.guid,
                indexer_id: release.indexer_id,
                episode_id: context.episode_id
            })
        });

        const data = await response.json();

        if (response.ok && data.success) {
            downloadBtn.style.background = '#22c55e';
            downloadBtn.style.borderColor = '#22c55e';
            downloadBtn.innerHTML = '<i class="fas fa-check"></i>';

            setTimeout(() => {
                downloadBtn.style.background = '';
                downloadBtn.style.borderColor = '';
                downloadBtn.innerHTML = '<i class="fas fa-download"></i>';
                downloadBtn.disabled = false;
            }, 2000);
        } else {
            throw new Error(data.message || 'Failed to download');
        }
    } catch (error) {
        console.error('Error downloading release:', error);

        downloadBtn.style.background = '#ef4444';
        downloadBtn.style.borderColor = '#ef4444';
        downloadBtn.innerHTML = '<i class="fas fa-times"></i>';

        alert(error.message || 'Failed to download release');

        setTimeout(() => {
            downloadBtn.style.background = '';
            downloadBtn.style.borderColor = '';
            downloadBtn.innerHTML = '<i class="fas fa-download"></i>';
            downloadBtn.disabled = false;
        }, 2000);
    }
}

// Close modal on escape key (cascading: sources → episode)
document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape' && document.getElementById('episodeModal').style.display === 'block') {
        if (document.getElementById('episodeSourcesModal').style.display === 'flex') {
            closeEpisodeSourcesModal();
        } else {
            closeEpisodeModal();
        }
    }
});
