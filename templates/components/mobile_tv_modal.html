<!-- Plex TV Show Details Modal -->
<!-- IMPORTANT: This modal is designed for iPhone PWA with viewport 393px x 852px -->
<div class="tv-modal" id="tvModal" style="display: none;">
    <div class="tv-modal-overlay">
        <!-- Top safe area overlay - prevents content from showing through status bar -->
        <div class="safe-area-top-overlay"></div>

        <!-- Sticky header that appears on scroll -->
        <div class="sticky-header" id="tvStickyHeader">
            <button class="modal-close-btn-header" onclick="closeTvModal()">
                <i class="fas fa-times"></i>
            </button>
            <h2 class="sticky-header-title" id="tvStickyHeaderTitle"></h2>
        </div>

        <!-- Fixed Backdrop - Never scrolls -->
        <div class="backdrop-section">
            <!-- Close button in top left -->
            <button class="modal-close-btn-backdrop" onclick="closeTvModal()">
                <i class="fas fa-times"></i>
            </button>

            <img id="tvModalBackdropImage" class="backdrop-image" alt="TV Show Backdrop" src="" style="opacity: 0;">
            <div class="backdrop-gradient"></div>
        </div>

        <!-- Scrollable Content - starts right under backdrop -->
        <div class="mockup">
            <div class="content-container">

                <!-- Clearlogo positioned above TV info -->
                <div class="clearlogo-container">
                    <img id="tvModalClearlogo" class="clearlogo-image" alt="" src="" style="display: none;">
                    <h1 id="tvModalClearlogoFallback" class="clearlogo-fallback-title"></h1>
                </div>

                <!-- TV Info Section (Centered) -->
                <div class="tv-bottom-info">
                    <!-- Title -->
                    <div class="tv-title-container">
                        <h1 class="tv-title" id="tvModalTitle">Loading...</h1>
                    </div>

                    <!-- Meta Info Line (includes genres) - CENTERED -->
                    <div class="tv-meta-info">
                        <span id="tvModalYear"></span>
                        <span id="tvModalSeasons"></span>
                        <span id="tvModalRating"></span>
                        <span id="tvModalGenres"></span>
                    </div>
                </div>

                <!-- Ratings Bar -->
                <div class="ratings-bar" id="tvRatingsBar">
                    <div class="rating-item" id="tvImdbRating" style="display: none;">
                        <img src="/static/images/imdb-logo.png" alt="IMDb" class="rating-icon">
                        <span class="rating-score" id="tvImdbScore">-</span>
                    </div>

                    <div class="rating-item" id="tvRtCriticRating" style="display: none;">
                        <img id="tvRtCriticIcon" src="/static/images/rotten-tomatoes-logo.png" alt="RT Critics" class="rating-icon">
                        <span class="rating-score" id="tvRtCriticScore">-</span>
                    </div>

                    <div class="rating-item" id="tvRtAudienceRating" style="display: none;">
                        <img id="tvRtAudienceIcon" src="/static/images/rotten-tomatoes-popcorn-good.png" alt="RT Audience" class="rating-icon">
                        <span class="rating-score" id="tvRtAudienceScore">-</span>
                    </div>

                    <div class="rating-item" id="tvMetacriticRating" style="display: none;">
                        <img src="/static/images/metacritic.png" alt="Metacritic" class="rating-icon">
                        <span class="rating-score" id="tvMetacriticScore">-</span>
                    </div>

                    <div class="rating-item" id="tvTmdbRating" style="display: none;">
                        <img src="/static/images/tmdb-logo.svg" alt="TMDb" class="rating-icon">
                        <span class="rating-score" id="tvTmdbScore">-</span>
                    </div>
                </div>

                <!-- Play Button (styled like movie modal) -->
                <button class="primary-action-button" id="tvPrimaryActionButton" onclick="handleWatchShow()" style="display: none;">
                    <i class="fas fa-play"></i>
                    <span>Watch</span>
                </button>

                <!-- Add to Sonarr button (shown only if not in Sonarr) -->
                <button class="sonarr-add-button" id="tvSonarrAddButton" onclick="addToSonarr()" style="display: none;">
                    <i class="fas fa-plus" id="tvSonarrAddIcon"></i>
                    <span id="tvSonarrAddText">Add to Sonarr</span>
                </button>

                <!-- Plot section -->
                <div class="plot-section">
                    <div class="plot-text" id="tvModalDescription">
                        Loading plot information...
                    </div>
                    <button class="more-button" id="tvMoreButton" onclick="toggleTvSummary()" style="display: none;">
                        More
                    </button>
                </div>

                <!-- Seasons Section -->
                <div class="seasons-section">
                    <h3 class="section-title">Seasons</h3>

                    <!-- Seasons Grid (Horizontal Scroll) -->
                    <div class="seasons-loading" id="seasonsLoading" style="text-align: center; color: rgba(255,255,255,0.5); padding: 40px 20px;">
                        <i class="fas fa-circle-notch fa-spin" style="font-size: 24px; margin-bottom: 10px; display: block;"></i>
                        Loading seasons...
                    </div>
                    <div class="seasons-grid" id="seasonsGrid" style="display: none;">
                        <!-- Season posters will be dynamically added here -->
                    </div>
                    <div class="seasons-empty" id="seasonsEmpty" style="display: none; text-align: center; color: rgba(255,255,255,0.5); padding: 40px 20px;">
                        No season information available
                    </div>
                </div>

                <!-- Cast & Crew Section (creators first, then cast) -->
                <div class="cast-section" id="tvCastCrewSection" style="display: none; padding-bottom: env(safe-area-inset-bottom, 20px);">
                    <h3 class="section-title">Cast & Crew</h3>
                    <div class="cast-grid" id="tvCastCrewGrid">
                        <!-- Creators + cast will be dynamically added here -->
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<style>
/* TV Modal inherits most styles from movie modal, only differences below */
.tv-modal {
    position: fixed !important;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    width: 100vw;
    max-width: 100vw;
    height: 100vh;
    height: 100dvh;
    background: #000;
    z-index: 10000;
    overflow: hidden;
    overflow-x: hidden !important;
}

/* Taller backdrop with rounded top corners (like Plex app) */
.tv-modal .backdrop-section {
    min-height: 420px;
    height: calc(420px + env(safe-area-inset-top, 0));
    border-radius: 16px 16px 0 0;
    overflow: hidden;
}

/* Less overlap so title sits lower on screen */
.tv-modal .mockup {
    margin-top: -80px;
    min-height: calc(100vh - 420px);
}

/* No bottom safe area — content extends to very bottom edge (PWA) */

/* Backdrop Watch Icon (same as episode modal) */
.tv-modal .backdrop-watch-icon {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 80px;
    height: 80px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.25);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border: 2px solid rgba(255, 255, 255, 0.4);
    color: white;
    font-size: 28px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: all 0.3s ease;
    z-index: 10;
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
}

.tv-modal .backdrop-watch-icon:hover {
    background: rgba(255, 255, 255, 0.35);
    transform: translate(-50%, -50%) scale(1.1);
    box-shadow: 0 6px 30px rgba(0, 0, 0, 0.4);
}

.tv-modal .backdrop-watch-icon:active {
    transform: translate(-50%, -50%) scale(0.95);
}

.tv-modal .backdrop-watch-icon i {
    margin-left: 3px;
}

.tv-modal-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    height: 100dvh;
    background: #000;
    overflow-y: auto;
    overflow-x: hidden !important;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;  /* Firefox */
    -ms-overflow-style: none;  /* IE and Edge */
}

/* Hide scrollbar for Chrome, Safari and Opera */
.tv-modal-overlay::-webkit-scrollbar {
    display: none;
    width: 0;
    height: 0;
}

/* Clearlogo: more space below image, less below fallback text */
.tv-modal .clearlogo-container.has-clearlogo {
    margin-bottom: 16px;
}
.tv-modal .clearlogo-container.has-fallback {
    margin-bottom: 2px;
    min-height: auto;
}

/* TV info - CENTERED */
.tv-bottom-info {
    margin-bottom: 0px !important;
    text-align: center;
}

.tv-title-container {
    margin-bottom: 2px;
    padding: 0 16px;
}

.tv-title {
    font-size: 32px;
    font-weight: 700;
    color: white;
    margin: 0;
    line-height: 1.2;
}

/* Meta info (includes inline genres) - CENTERED, narrower than title */
.tv-meta-info {
    display: flex;
    flex-wrap: wrap;
    gap: 0;
    margin: 0 auto !important;
    padding: 0 40px !important;
    color: rgba(255, 255, 255, 0.55);
    font-size: 13px;
    justify-content: center;
    overflow: hidden;
}

.tv-meta-info span {
    flex-shrink: 0;
    white-space: nowrap;
}

.tv-meta-info span:not(:last-child)::after {
    content: "•";
    margin: 0 6px;
    color: rgba(255, 255, 255, 0.25);
}

.tv-meta-info span:empty {
    display: none;
}

.tv-meta-info span:empty + span::after {
    display: none;
}

/* Hide the bullet after the last non-empty span */
.tv-meta-info span:last-child::after {
    display: none;
}

/* TV ratings bar - wider than meta, narrower than title */
.tv-modal .ratings-bar {
    gap: 20px;
    margin-top: 8px !important;
    padding: 0 24px !important;
}

/* Seasons section wrapper */
.seasons-section {
    margin-bottom: 5px;
    margin-left: 0;
    margin-right: 0;
    padding: 0;
    width: 100vw;
    position: relative;
    left: 50%;
    right: 50%;
    margin-left: -50vw;
    margin-right: -50vw;
}

.seasons-grid {
    display: flex;
    gap: 20px;
    overflow-x: auto;
    overflow-y: hidden;
    padding: 10px 20px 40px 20px;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
    -ms-overflow-style: none;
    scroll-snap-type: x proximity;

.seasons-grid::-webkit-scrollbar {
    display: none;
}

.season-card {
    flex-shrink: 0;
    width: 140px;
    cursor: pointer;
    transition: transform 0.2s ease;
    scroll-snap-align: start;
}

.season-card:hover {
    transform: scale(1.05);
}

.season-poster {
    width: 140px;
    height: 210px;
    border-radius: 8px;
    object-fit: cover;
    background: rgba(255, 255, 255, 0.1);
    margin-bottom: 8px;
    position: relative;
}

.season-poster img {
    width: 100%;
    height: 100%;
    border-radius: 8px;
    object-fit: cover;
}

.season-owned-badge {
    position: absolute;
    top: 8px;
    right: 8px;
    background: rgba(16, 185, 129, 0.9);
    color: white;
    padding: 4px 8px;
    border-radius: 12px;
    font-size: 11px;
    font-weight: 600;
    backdrop-filter: blur(10px);
}

.season-owned-badge.partial {
    background: rgba(245, 158, 11, 0.9);
}

.season-name {
    font-size: 14px;
    color: rgba(255, 255, 255, 0.9);
    font-weight: 500;
    margin-bottom: 2px;
    text-align: center;

}

.season-episode-count {
    font-size: 12px;
    color: rgba(255, 255, 255, 0.5);
    text-align: center;
    line-height: 1.3;
}

/* Loading and empty states */
.seasons-loading,
.seasons-empty {
    padding: 40px 20px !important;
}

/* Primary Action Button - match movie modal (white pill) */
.tv-modal .primary-action-button {
    background: #ffffff;
    color: #000000;
    border-radius: 50px;
}

.tv-modal .primary-action-button:hover {
    background: rgba(255, 255, 255, 0.85);
}

.tv-modal .primary-action-button i {
    color: #000000;
}

/* Sonarr Add button (displayed below play button when not owned) */
.sonarr-add-button {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    width: calc(100% - 32px);
    margin: 0 16px 20px 16px;
    padding: 14px 20px;
    background: #10b981;
    color: white;
    border: none;
    border-radius: 12px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;

}

.sonarr-add-button:hover {
    background: #2563eb;
    transform: scale(1.02);
}

.sonarr-add-button:active {

}

.sonarr-add-button:disabled {
    opacity: 0.6;
    cursor: not-allowed;
}

.sonarr-add-button i {
    font-size: 18px;
}

/* Sonarr button variant (deprecated - kept for compatibility) */
.watch-button.sonarr-button {
    background: #3b82f6;
    color: white;
}

.watch-button.sonarr-button:hover {
    background: #2563eb;
}

.watch-button.sonarr-button i {
    color: white;
}

/* Body modal open state */
body.tv-modal-open {
    overflow: hidden !important;
    overflow-x: hidden !important;
    overflow-y: hidden !important;
    position: fixed;
    width: 100%;
    height: 100%;
}
</style>

<script>
// TV Modal Functions
window.window.currentTvShow = null;  // Make it global so episode modal can access it
let currentSeasons = [];
let episodeOwnership = {};

function openTvModal(tvShow, isOwned = null) {
    console.log('openTvModal called with:', tvShow, 'isOwned:', isOwned);
    window.window.currentTvShow = tvShow;  // Set globally

    // If ownership status was provided, use it
    if (isOwned !== null) {
        window.window.currentTvShow.isOwned = isOwned;
    }

    // Check if modal exists
    const modal = document.getElementById('tvModal');
    if (!modal) {
        console.error('TV Modal element not found!');
        return;
    }

    // Hide Sonarr button initially until we determine ownership/Sonarr status
    const sonarrButton = document.getElementById('tvSonarrAddButton');
    if (sonarrButton) {
        sonarrButton.style.display = 'none';
    }

    // Start ownership and button checks in background (don't block modal opening)
    const checkOwnershipAndButtons = async () => {
        // Check ownership if we have a TVDB ID and don't already know the status
        if (tvShow.tvdb_id && window.window.currentTvShow.isOwned === undefined) {
            await fetchEpisodeOwnership(tvShow.tvdb_id);
        } else if (tvShow.tvdb_id) {
            // We know ownership status but still need episode details for seasons
            fetchEpisodeOwnership(tvShow.tvdb_id); // Don't await, just for episode data
        }

        // Now update buttons after we know ownership status
        await updateTvPrimaryButton();
    };

    // Run async without blocking
    checkOwnershipAndButtons();

    // Update modal content
    document.getElementById('tvModalTitle').textContent = tvShow.title || tvShow.name || 'Unknown Title';
    document.getElementById('tvStickyHeaderTitle').textContent = tvShow.title || tvShow.name || 'Unknown Title';

    // Meta info
    document.getElementById('tvModalYear').textContent = tvShow.year || tvShow.first_air_date?.substring(0, 4) || '';
    document.getElementById('tvModalSeasons').textContent = tvShow.number_of_seasons ? `${tvShow.number_of_seasons} Seasons` : '';
    document.getElementById('tvModalRating').textContent = tvShow.content_rating || '';

    // Description with collapse functionality (3 lines max)
    const descriptionElement = document.getElementById('tvModalDescription');
    const moreButton = document.getElementById('tvMoreButton');
    const summary = tvShow.summary || tvShow.overview || 'No summary available.';

    descriptionElement.textContent = summary;

    // Always start collapsed
    descriptionElement.classList.add('collapsed');

    // Check if content overflows 3 lines after render
    setTimeout(() => {
        const isOverflowing = descriptionElement.scrollHeight > descriptionElement.clientHeight;
        if (isOverflowing) {
            moreButton.style.display = 'block';
            moreButton.textContent = 'More';
        } else {
            descriptionElement.classList.remove('collapsed');
            moreButton.style.display = 'none';
        }
    }, 0);

    // Genres (inline text, first 2 only)
    const genresContainer = document.getElementById('tvModalGenres');
    if (tvShow.genres && tvShow.genres.length > 0) {
        const genresList = Array.isArray(tvShow.genres)
            ? tvShow.genres.map(g => typeof g === 'string' ? g : g.tag || g.name || g)
            : [];

        if (genresList.length > 0) {
            const firstTwoGenres = genresList.slice(0, 2).join(', ');
            genresContainer.textContent = firstTwoGenres;
        } else {
            genresContainer.textContent = '';
        }
    } else {
        genresContainer.textContent = '';
    }

    // Populate Cast & Crew Section (creators first, then cast)
    const castCrewSection = document.getElementById('tvCastCrewSection');
    const castCrewGrid = document.getElementById('tvCastCrewGrid');

    function renderTvCastCrew() {
        castCrewGrid.innerHTML = '';
        let hasContent = false;

        // Creators first
        if (tvShow.created_by && tvShow.created_by.length > 0) {
            tvShow.created_by.forEach(creator => {
                const el = document.createElement('div');
                el.className = 'cast-member';

                let finalPhotoUrl = '';
                if (creator.profile_path) {
                    finalPhotoUrl = `https://image.tmdb.org/t/p/w185${creator.profile_path}`;
                } else if (creator.thumb && (creator.thumb.startsWith('http') || creator.thumb.startsWith('//'))) {
                    finalPhotoUrl = creator.thumb;
                }

                const creatorName = creator.name || 'Unknown';

                el.innerHTML = `
                    <img class="cast-photo" src="${finalPhotoUrl}" alt="${creatorName}" onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ccircle cx=%2250%22 cy=%2250%22 r=%2250%22 fill=%22%23333%22/%3E%3Cpath d=%22M50 45c8.3 0 15-6.7 15-15s-6.7-15-15-15-15 6.7-15 15 6.7 15 15 15zm0 7.5c-12.5 0-37.5 6.3-37.5 18.8v9.4h75v-9.4c0-12.5-25-18.8-37.5-18.8z%22 fill=%22%23666%22/%3E%3C/svg%3E'">
                    <div class="cast-name">${creatorName}</div>
                    <div class="cast-character">Creator</div>
                `;

                el.style.cursor = 'pointer';
                el.onclick = function() {
                    closeTvModal();
                    window.location.href = `/library?search=${encodeURIComponent(creatorName)}&filter=people`;
                };

                castCrewGrid.appendChild(el);
            });
            hasContent = true;
        }

        // Then cast
        if (tvShow.cast && tvShow.cast.length > 0) {
            const castToShow = tvShow.cast.slice(0, 10);
            castToShow.forEach(actor => {
                const el = document.createElement('div');
                el.className = 'cast-member';

                const finalPhotoUrl = actor.profile_path
                    ? `https://image.tmdb.org/t/p/w185${actor.profile_path}`
                    : (actor.thumb || actor.photo || '');

                const actorName = actor.tag || actor.name || 'Unknown';

                el.innerHTML = `
                    <img class="cast-photo" src="${finalPhotoUrl}" alt="${actorName}" onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ccircle cx=%2250%22 cy=%2250%22 r=%2250%22 fill=%22%23333%22/%3E%3Cpath d=%22M50 45c8.3 0 15-6.7 15-15s-6.7-15-15-15-15 6.7-15 15 6.7 15 15 15zm0 7.5c-12.5 0-37.5 6.3-37.5 18.8v9.4h75v-9.4c0-12.5-25-18.8-37.5-18.8z%22 fill=%22%23666%22/%3E%3C/svg%3E'">
                    <div class="cast-name">${actorName}</div>
                    <div class="cast-character">${actor.role || actor.character || ''}</div>
                `;

                el.style.cursor = 'pointer';
                el.onclick = function() {
                    closeTvModal();
                    if (actor.actor_id) {
                        window.location.href = `/library?actor=${encodeURIComponent(actorName)}&actor_id=${actor.actor_id}`;
                    } else {
                        window.location.href = `/library?search=${encodeURIComponent(actorName)}&filter=people`;
                    }
                };

                castCrewGrid.appendChild(el);
            });
            hasContent = true;
        }

        castCrewSection.style.display = hasContent ? 'block' : 'none';
    }

    // Render with whatever data we have now
    renderTvCastCrew();

    // If no creators yet, try fetching from TMDB and re-render
    if ((!tvShow.created_by || tvShow.created_by.length === 0) && tvShow.tmdb_id) {
        fetch(`https://api.themoviedb.org/3/tv/${tvShow.tmdb_id}?api_key={{ tmdb_api_key }}`)
            .then(response => response.ok ? response.json() : null)
            .then(data => {
                if (data && data.created_by && data.created_by.length > 0) {
                    tvShow.created_by = data.created_by.map(c => ({ name: c.name, profile_path: c.profile_path }));
                    renderTvCastCrew();
                }
            })
            .catch(err => console.log('Could not fetch creators:', err));
    }

    // Set backdrop
    const backdropImg = document.getElementById('tvModalBackdropImage');
    if (tvShow.backdrop_url) {
        backdropImg.src = tvShow.backdrop_url;
        backdropImg.style.opacity = '0.7';
    } else if (tvShow.poster_url && !tvShow.poster_url.includes('placeholder')) {
        backdropImg.src = tvShow.poster_url;
        backdropImg.style.opacity = '0.6';
    } else {
        backdropImg.style.opacity = '0';
    }

    // Set clearlogo if available
    const clearlogoImg = document.getElementById('tvModalClearlogo');
    const clearlogoFallback = document.getElementById('tvModalClearlogoFallback');
    const titleElement = document.getElementById('tvModalTitle');

    const clearlogoContainer = clearlogoImg.parentElement;
    if (tvShow.clearlogo_url) {
        // We have a clearlogo - use it and hide both fallback and title
        clearlogoImg.src = tvShow.clearlogo_url;
        clearlogoImg.style.display = 'block';
        clearlogoFallback.style.display = 'none';
        titleElement.style.display = 'none';
        clearlogoContainer.classList.add('has-clearlogo');
        clearlogoContainer.classList.remove('has-fallback');
    } else {
        // No clearlogo - use fallback title over backdrop, hide clearlogo and bottom title
        clearlogoImg.style.display = 'none';
        clearlogoFallback.textContent = tvShow.title || tvShow.name || 'Unknown Title';
        clearlogoFallback.style.display = 'block';
        titleElement.style.display = 'none';  // Keep the bottom title hidden since we're showing it over the backdrop
        clearlogoContainer.classList.remove('has-clearlogo');
        clearlogoContainer.classList.add('has-fallback');
    }

    // Reset ratings (hide all initially)
    document.getElementById('tvImdbRating').style.display = 'none';
    document.getElementById('tvRtCriticRating').style.display = 'none';
    document.getElementById('tvRtAudienceRating').style.display = 'none';
    document.getElementById('tvMetacriticRating').style.display = 'none';
    document.getElementById('tvTmdbRating').style.display = 'none';

    // Load seasons and episodes first (most important)
    if (tvShow.tmdb_id || tvShow.tvdb_id) {
        loadSeasons(tvShow.tmdb_id, tvShow.tvdb_id);
    }

    // Fetch ratings separately (less important, can load after)
    // Try Plex first for richer ratings, fall back to TMDb/OMDb
    if (tvShow.tmdb_id) {
        fetchTvPlexRatings(tvShow.rating_key, tvShow.tmdb_id, tvShow.title || tvShow.name, tvShow.year || tvShow.first_air_date?.substring(0, 4));
    }

    // Fetch UltraBlur colors for colored background
    fetchTvUltraBlurColors(tvShow);

    // Show modal
    console.log('Showing TV modal...');
    document.getElementById('tvModal').style.display = 'block';
    document.body.classList.add('tv-modal-open');

    // Scroll to top
    const modalOverlay = document.querySelector('.tv-modal-overlay');
    modalOverlay.scrollTop = 0;

    // Setup scroll listener for sticky header
    modalOverlay.addEventListener('scroll', handleTvModalScroll);
}

async function updateTvPrimaryButton() {
    const cornerWatchlistBtn = document.querySelector('.modal-watchlist-btn-backdrop');
    const primaryActionBtn = document.getElementById('tvPrimaryActionButton');
    const sonarrAddButton = document.getElementById('tvSonarrAddButton');

    // Now we know the ownership status for certain
    if (window.currentTvShow.isOwned) {
        // Owned in Plex - Show play button
        if (cornerWatchlistBtn) cornerWatchlistBtn.style.display = 'flex';
        if (primaryActionBtn) {
            primaryActionBtn.style.display = 'flex';
            primaryActionBtn.querySelector('span').textContent = 'Watch';
        }
        sonarrAddButton.style.display = 'none';
    } else {
        // Not owned - hide play buttons
        if (cornerWatchlistBtn) cornerWatchlistBtn.style.display = 'none';
        if (primaryActionBtn) primaryActionBtn.style.display = 'none';

        // Check Sonarr status (await to prevent flickering)
        if (window.window.currentTvShow.tvdb_id) {
            try {
                // Pass TMDB ID as fallback for matching
                const tmdbId = window.window.currentTvShow.id || window.window.currentTvShow.tmdb_id;
                const url = `/api/sonarr/status/${window.window.currentTvShow.tvdb_id}` +
                           (tmdbId ? `?tmdb_id=${tmdbId}` : '');
                const response = await fetch(url);
                const sonarrData = await response.json();

                if (!sonarrData.exists) {
                    // Not in Sonarr, show add button
                    sonarrAddButton.style.display = 'flex';
                } else {
                    // Already in Sonarr, hide button
                    sonarrAddButton.style.display = 'none';
                }
            } catch (error) {
                console.error('Error checking Sonarr status:', error);
                // Show button on error (user can try to add)
                sonarrAddButton.style.display = 'flex';
            }
        } else {
            // No TVDB ID, can't add to Sonarr
            sonarrAddButton.style.display = 'none';
        }
    }
}

async function loadSeasons(tmdbId, tvdbId) {
    const seasonsLoading = document.getElementById('seasonsLoading');
    const seasonsGrid = document.getElementById('seasonsGrid');
    const seasonsEmpty = document.getElementById('seasonsEmpty');

    // If no TMDB ID, show empty state immediately
    if (!tmdbId) {
        console.warn('No TMDB ID available for loading seasons');
        seasonsLoading.style.display = 'none';
        seasonsGrid.style.display = 'none';
        seasonsEmpty.style.display = 'block';
        return;
    }

    // Show loading state
    seasonsLoading.style.display = 'block';
    seasonsGrid.style.display = 'none';
    seasonsEmpty.style.display = 'none';

    try {
        // Fetch seasons and episodes from TMDB
        const response = await fetch(`/api/tv/seasons/${tmdbId}`);

        if (response.ok) {
            const data = await response.json();

            if (data.success && data.seasons && data.seasons.length > 0) {
                currentSeasons = data.seasons;

                // Fetch episode ownership if we have TVDB ID
                if (tvdbId) {
                    // Do it async so we don't block season display
                    fetchEpisodeOwnership(tvdbId).then(() => {
                        // Refresh the season display with ownership data
                        displaySeasons(currentSeasons);
                    });
                }

                // Display seasons immediately (without ownership data initially)
                displaySeasons(currentSeasons);
            } else {
                seasonsLoading.style.display = 'none';
                seasonsEmpty.style.display = 'block';
            }
        } else {
            seasonsLoading.style.display = 'none';
            seasonsEmpty.style.display = 'block';
        }
    } catch (error) {
        console.error('Failed to load seasons:', error);
        seasonsLoading.style.display = 'none';
        seasonsEmpty.style.display = 'block';
    }
}

async function fetchEpisodeOwnership(tvdbId) {
    try {
        // Pass title and year for more reliable matching
        const title = window.currentTvShow.title || window.currentTvShow.name;
        const year = window.currentTvShow.year || window.currentTvShow.first_air_date?.substring(0, 4);

        // Use direct endpoint (network mount is fast enough)
        let url = `/api/tv/ownership/${tvdbId}`;
        const params = [];
        if (title) params.push(`title=${encodeURIComponent(title)}`);
        if (year) params.push(`year=${year}`);
        if (params.length > 0) url += '?' + params.join('&');

        const response = await fetch(url);
        if (response.ok) {
            const data = await response.json();
            episodeOwnership = data.episodes || {};
            window.currentTvShow.isOwned = data.is_owned || false;
            console.log('Episode ownership data:', episodeOwnership, 'Is Owned:', window.currentTvShow.isOwned);

            // Don't update button here - it's handled in openTvModal
        }
    } catch (error) {
        console.error('Failed to fetch episode ownership:', error);
        episodeOwnership = {};
    }
}

function displaySeasons(seasons) {
    const seasonsLoading = document.getElementById('seasonsLoading');
    const seasonsGrid = document.getElementById('seasonsGrid');
    const seasonsEmpty = document.getElementById('seasonsEmpty');

    if (seasons.length === 0) {
        seasonsLoading.style.display = 'none';
        seasonsGrid.style.display = 'none';
        seasonsEmpty.style.display = 'block';
        return;
    }

    // Clear existing content
    seasonsGrid.innerHTML = '';

    // Include all seasons including Season 0 (Specials)
    seasons.forEach(season => {
        const seasonCard = document.createElement('div');
        seasonCard.className = 'season-card';

        // Calculate ownership status
        const episodes = season.episodes || [];
        let ownedCount = 0;
        episodes.forEach(ep => {
            const key = `s${season.season_number}e${ep.episode_number}`;
            if (episodeOwnership[key] && episodeOwnership[key].owned) {
                ownedCount++;
            }
        });

        const totalEpisodes = episodes.length;
        const isFullyOwned = ownedCount === totalEpisodes && totalEpisodes > 0;
        const isPartiallyOwned = ownedCount > 0 && ownedCount < totalEpisodes;

        // Season poster container
        const seasonPoster = document.createElement('div');
        seasonPoster.className = 'season-poster';

        // Use season poster_path from TMDB if available
        if (season.poster_path) {
            const img = document.createElement('img');
            img.src = `https://image.tmdb.org/t/p/w300${season.poster_path}`;
            img.alt = `Season ${season.season_number}`;
            img.onerror = function() {
                this.style.display = 'none';
            };
            seasonPoster.appendChild(img);
        }

        // Add ownership badge if owned
        if (isFullyOwned) {
            const badge = document.createElement('div');
            badge.className = 'season-owned-badge';
            badge.innerHTML = '<i class="fas fa-check"></i>';
            seasonPoster.appendChild(badge);
        } else if (isPartiallyOwned) {
            const badge = document.createElement('div');
            badge.className = 'season-owned-badge partial';
            badge.textContent = `${ownedCount}/${totalEpisodes}`;
            seasonPoster.appendChild(badge);
        }

        // Season name
        const seasonName = document.createElement('div');
        seasonName.className = 'season-name';
        seasonName.textContent = season.season_number === 0 ? 'Specials' : `Season ${season.season_number}`;

        // Episode count
        const episodeCount = document.createElement('div');
        episodeCount.className = 'season-episode-count';
        episodeCount.textContent = `${totalEpisodes} Episode${totalEpisodes !== 1 ? 's' : ''}`;

        // Add click handler to open season modal
        seasonCard.addEventListener('click', function() {
            openSeasonModal(season, ownedCount, totalEpisodes);
        });

        seasonCard.appendChild(seasonPoster);
        seasonCard.appendChild(seasonName);
        seasonCard.appendChild(episodeCount);
        seasonsGrid.appendChild(seasonCard);
    });

    // Show container, hide loading
    seasonsLoading.style.display = 'none';
    seasonsGrid.style.display = 'flex';
    seasonsEmpty.style.display = 'none';
}

function formatDate(dateString) {
    const date = new Date(dateString);
    if (isNaN(date.getTime())) return '';

    const options = { month: 'short', day: 'numeric', year: 'numeric' };
    return date.toLocaleDateString('en-US', options);
}

async function fetchTvRatings(tmdbId, title, year) {
    try {
        // Fetch TMDB rating
        const tmdbResponse = await fetch(`https://api.themoviedb.org/3/tv/${tmdbId}?api_key={{ tmdb_api_key }}`);
        if (tmdbResponse.ok) {
            const tmdbData = await tmdbResponse.json();
            if (tmdbData.vote_average) {
                document.getElementById('tvImdbScore').textContent = tmdbData.vote_average.toFixed(1);
                document.getElementById('tvImdbRating').style.display = 'flex';
            }
        }

        // Fetch additional ratings from OMDB if available
        if (title && year) {
            const omdbResponse = await fetch(`/api/ratings/${encodeURIComponent(title)}?year=${year}`);
            if (omdbResponse.ok) {
                const omdbData = await omdbResponse.json();

                if (omdbData.imdb && omdbData.imdb.score) {
                    document.getElementById('tvImdbScore').textContent = omdbData.imdb.score;
                    document.getElementById('tvImdbRating').style.display = 'flex';
                }

                if (omdbData.rotten_tomatoes_critic) {
                    const score = parseInt(omdbData.rotten_tomatoes_critic.score);
                    document.getElementById('tvRtCriticScore').textContent = `${score}%`;
                    const iconElement = document.getElementById('tvRtCriticIcon');
                    if (score < 60) {
                        iconElement.src = '/static/images/rotten-tomatoes-splat.png';
                    } else {
                        iconElement.src = '/static/images/rotten-tomatoes-logo.png';
                    }
                    document.getElementById('tvRtCriticRating').style.display = 'flex';
                }

                if (omdbData.metacritic && omdbData.metacritic.score) {
                    document.getElementById('tvMetacriticScore').textContent = omdbData.metacritic.score;
                    document.getElementById('tvMetacriticRating').style.display = 'flex';
                }
            }
        }
    } catch (error) {
        console.error('Failed to fetch TV ratings:', error);
    }
}

function displayTvPlexRatings(data) {
    if (data.imdb) {
        document.getElementById('tvImdbScore').textContent = data.imdb.score;
        document.getElementById('tvImdbRating').style.display = 'flex';
    }

    if (data.rotten_tomatoes_critic) {
        const score = data.rotten_tomatoes_critic.score;
        document.getElementById('tvRtCriticScore').textContent = `${score}%`;
        const iconElement = document.getElementById('tvRtCriticIcon');
        if (score < 60) {
            iconElement.src = '/static/images/rotten-tomatoes-splat.png';
        } else {
            iconElement.src = '/static/images/rotten-tomatoes-logo.png';
        }
        document.getElementById('tvRtCriticRating').style.display = 'flex';
    }

    if (data.rotten_tomatoes_audience) {
        const score = data.rotten_tomatoes_audience.score;
        document.getElementById('tvRtAudienceScore').textContent = `${score}%`;
        const iconElement = document.getElementById('tvRtAudienceIcon');
        if (score < 60) {
            iconElement.src = '/static/images/rotten-tomatoes-popcorn-bad.png';
        } else {
            iconElement.src = '/static/images/rotten-tomatoes-popcorn-good.png';
        }
        document.getElementById('tvRtAudienceRating').style.display = 'flex';
    }

    if (data.metacritic) {
        document.getElementById('tvMetacriticScore').textContent = data.metacritic.score;
        document.getElementById('tvMetacriticRating').style.display = 'flex';
    }

    if (data.tmdb) {
        document.getElementById('tvTmdbScore').textContent = data.tmdb.score;
        document.getElementById('tvTmdbRating').style.display = 'flex';
    }
}

async function fetchTvPlexRatings(ratingKey, tmdbId, title, year) {
    try {
        // Try Plex first (either by ratingKey or by resolving tmdb_id)
        const plexUrl = ratingKey
            ? `/api/plex/ratings/${ratingKey}`
            : `/api/plex/ratings/resolve?tmdb_id=${tmdbId}`;

        const plexResp = await fetch(plexUrl);
        if (plexResp.ok) {
            const data = await plexResp.json();
            // Check if Plex returned any actual ratings
            const hasRatings = data.imdb || data.rotten_tomatoes_critic ||
                               data.rotten_tomatoes_audience || data.metacritic || data.tmdb;
            if (hasRatings) {
                displayTvPlexRatings(data);
                return;
            }
        }
    } catch (e) {
        console.warn('Plex ratings fetch failed, falling back to TMDb/OMDb:', e);
    }

    // Fallback to TMDb + OMDb
    fetchTvRatings(tmdbId, title, year);
}

    // Reset UltraBlur colors
    resetTvUltraBlurColors();

// --- TV UltraBlur Colors ---
async function fetchTvUltraBlurColors(tvShow) {
    resetTvUltraBlurColors();

    const ratingKey = tvShow.rating_key;
    const tmdbId = tvShow.tmdb_id;
    if (!ratingKey && !tmdbId) return;

    try {
        // Try Plex UltraBlurColors first (works for owned shows)
        if (ratingKey) {
            const resp = await fetch(`/api/plex/ultrablur/${ratingKey}`);
            if (resp.ok) {
                const colors = await resp.json();
                if (colors.topLeft || colors.topRight || colors.bottomRight || colors.bottomLeft) {
                    applyTvUltraBlurColors(colors);
                    return;
                }
            }
        }

        // Fallback: extract colors from TMDb backdrop image
        if (tmdbId) {
            const resp = await fetch(`/api/tmdb/colors/${tmdbId}?type=tv`);
            if (resp.ok) {
                const colors = await resp.json();
                if (colors.topLeft || colors.topRight || colors.bottomRight || colors.bottomLeft) {
                    applyTvUltraBlurColors(colors);
                    return;
                }
            }
        }
    } catch (e) {
        // Non-critical — keep default dark background
    }
}

function applyTvUltraBlurColors(colors) {
    const tl = colors.topLeft || '#1a1a1a';
    const tr = colors.topRight || '#1a1a1a';
    const br = colors.bottomRight || '#0f0f0f';
    const bl = colors.bottomLeft || '#0f0f0f';

    const overlay = document.querySelector('.tv-modal-overlay');
    const mockup = overlay ? overlay.querySelector('.mockup') : null;
    const backdropSection = overlay ? overlay.querySelector('.backdrop-section') : null;

    if (overlay) {
        overlay.style.backgroundColor = '#0a0a0a';
        overlay.style.backgroundImage = [
            `radial-gradient(circle at 0% 0%, ${tl}, transparent 70%)`,
            `radial-gradient(circle at 100% 0%, ${tr}, transparent 70%)`,
            `radial-gradient(circle at 100% 100%, ${br}, transparent 70%)`,
            `radial-gradient(circle at 0% 100%, ${bl}, transparent 70%)`,
        ].join(', ');
    }
    if (mockup) {
        mockup.style.background = 'none';
    }
    if (backdropSection) {
        backdropSection.style.webkitMaskImage = 'linear-gradient(to bottom, black 20%, transparent 100%)';
        backdropSection.style.maskImage = 'linear-gradient(to bottom, black 20%, transparent 100%)';
    }
}

function resetTvUltraBlurColors() {
    const overlay = document.querySelector('.tv-modal-overlay');
    const mockup = overlay ? overlay.querySelector('.mockup') : null;
    const backdropSection = overlay ? overlay.querySelector('.backdrop-section') : null;

    if (overlay) {
        overlay.style.backgroundColor = '';
        overlay.style.backgroundImage = '';
    }
    if (mockup) {
        mockup.style.background = '';
    }
    if (backdropSection) {
        backdropSection.style.webkitMaskImage = '';
        backdropSection.style.maskImage = '';
    }
}

    if (window.currentTvShow && window.currentTvShow.isOwned) {
        // Owned show - Play S01E01
        await playTvShow();
    } else {
        // Not owned and not in Sonarr - Add to Sonarr

}

async function playTvShow() {
    try {
        const title = window.currentTvShow.title || window.currentTvShow.name;
        const year = window.currentTvShow.year || window.currentTvShow.first_air_date?.substring(0, 4);

        console.log('Starting playback for TV show:', title);

        // Get the show's rating key from Plex
        const response = await fetch(`/api/tv/show?title=${encodeURIComponent(title)}&year=${year || ''}`);
        if (!response.ok) {
            throw new Error('Show not found in Plex library');
        }

        const data = await response.json();
        if (!data.success || !data.show) {
            throw new Error('Show not found in Plex library');
        }

        const showRatingKey = data.show.rating_key;
        console.log('Found show with rating key:', showRatingKey);

        // Get S01E01's rating key
        const episodesResponse = await fetch(`/api/tv/episodes?show_rating_key=${showRatingKey}&season=1&episode=1`);
        if (!episodesResponse.ok) {
            throw new Error('S01E01 not found');
        }

        const episodesData = await episodesResponse.json();
        if (!episodesData.success || !episodesData.episode) {
            throw new Error('S01E01 not found');
        }

        const episode = episodesData.episode;
        console.log('Found S01E01:', episode);

        // Structure the TV show object like a movie object for the library modal
        const tvShowForPlayback = {
            title: `${title} - S01E01: ${episode.episode_title || 'Episode 1'}`,
            rating_key: episode.rating_key,
            libraries: episode.libraries || [],
            library_keys: episode.library_keys || {},
            backdrop_url: window.currentTvShow.backdrop_url || (window.currentTvShow.backdrop_path ? `https://image.tmdb.org/t/p/original${window.currentTvShow.backdrop_path}` : ''),
            clearlogo_url: window.currentTvShow.clearlogo_url || ''
        };

        console.log('Opening library selection modal with:', tvShowForPlayback);

        // Use the same playback flow as movies
        if (typeof window.showLibrarySelectionModal === 'function') {
            window.showLibrarySelectionModal(tvShowForPlayback);
        } else {
            console.error('showLibrarySelectionModal function not found!');
            alert('Playback function not available. Please refresh the page.');
        }

    } catch (error) {
        console.error('Error playing TV show:', error);
        alert(error.message || 'Failed to start playback');
    }
}

async function addToSonarr() {
    if (!window.currentTvShow || !window.currentTvShow.tvdb_id) {
        alert('Unable to add to Sonarr: Missing TVDB ID');
        return;
    }

    const actionButton = document.getElementById('tvSonarrAddButton');
    const actionIcon = document.getElementById('tvSonarrAddIcon');
    const actionText = document.getElementById('tvSonarrAddText');

    // Disable button and show spinner
    actionButton.disabled = true;
    actionIcon.className = 'fas fa-circle-notch fa-spin';
    actionText.textContent = 'Adding...';

    try {
        const response = await fetch('/api/sonarr/add', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({
                tvdb_id: window.currentTvShow.tvdb_id,
                title: window.currentTvShow.title || window.currentTvShow.name,
                monitor: 'all',
                quality_profile_id: 7, // TFlix profile
                search_missing: false  // Don't automatically search - manual only
            })
        });

        const result = await response.json();

        if (response.ok && result.success) {
            // Show success
            actionIcon.className = 'fas fa-check';
            actionText.textContent = 'Added to Sonarr!';
            actionButton.style.background = '#10b981';

            // Keep success state and hide button after success
            setTimeout(() => {
                actionButton.style.display = 'none';
            }, 2000);
        } else {
            // Show error
            actionIcon.className = 'fas fa-times';
            actionText.textContent = result.message || 'Failed to add';
            actionButton.style.background = '#ef4444';

            // Return to normal after 3 seconds
            setTimeout(() => {
                actionIcon.className = 'fas fa-plus';
                actionText.textContent = 'Add to Sonarr';
                actionButton.style.background = '#3b82f6';
                actionButton.disabled = false;
            }, 3000);
        }
    } catch (error) {
        console.error('Error adding to Sonarr:', error);

        // Show error
        actionIcon.className = 'fas fa-times';
        actionText.textContent = 'Error';
        actionButton.style.background = '#ef4444';

        // Return to normal after 3 seconds
        setTimeout(() => {
            actionIcon.className = 'fas fa-plus';
            actionText.textContent = 'Add to Sonarr';
            actionButton.style.background = '#3b82f6';
            actionButton.disabled = false;
        }, 3000);
    }
}
