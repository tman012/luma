<!-- Plex Movie Details Modal -->

<div class="movie-modal" id="movieModal" style="display: none;">
    <div class="movie-modal-overlay">
        <!-- Top safe area overlay - prevents content from showing through status bar -->
        <div class="safe-area-top-overlay"></div>

        <!-- Sticky header that appears on scroll -->
        <div class="sticky-header" id="stickyHeader">
            <button class="modal-close-btn-header" onclick="closeMovieModal()">
                <i class="fas fa-times"></i>
            </button>
            <h2 class="sticky-header-title" id="stickyHeaderTitle"></h2>
        </div>

        <!-- Fixed Backdrop - Never scrolls -->
        <div class="backdrop-section">
            <!-- Close button in top left -->
            <button class="modal-close-btn-backdrop" onclick="closeMovieModal()">
                <i class="fas fa-times"></i>
            </button>

            <!-- Watchlist button in top right -->
            <button class="modal-watchlist-btn-backdrop" onclick="toggleWatchlist()">
                <i class="fas fa-bookmark"></i>
            </button>

            <img id="modalBackdropImage" class="backdrop-image" alt="Movie Backdrop" src="" style="opacity: 0;">
            <div class="backdrop-gradient"></div>
        </div>

        <!-- Scrollable Content - starts right under backdrop -->
        <div class="mockup">
            <div class="content-container">

                <!-- Clearlogo positioned above movie info -->
                <div class="clearlogo-container">
                    <img id="modalClearlogo" class="clearlogo-image" alt="" src="" style="display: none;">
                    <h1 id="modalClearlogoFallback" class="clearlogo-fallback-title"></h1>
                </div>

                <!-- Movie Info Section (Centered) -->
                <div class="movie-bottom-info">
                    <!-- Title -->
                    <div class="movie-title-container">
                        <h1 class="movie-title" id="modalTitle">Loading...</h1>
                    </div>

                    <!-- Meta Info Line (includes genres) -->
                    <div class="movie-meta-info">
                        <span id="modalYear"></span>
                        <span id="modalRuntime"></span>
                        <span id="modalRating"></span>
                        <span id="modalGenres"></span>
                    </div>
                </div>

                <!-- Ratings Bar -->

                        <img src="/static/images/imdb-logo.png" alt="IMDb" class="rating-icon">
                        <span class="rating-score" id="imdbScore">-</span>
                    </div>

                    <div class="rating-item" id="rtCriticRating" style="display: none;">
                        <img id="rtCriticIcon" src="/static/images/rotten-tomatoes-logo.png" alt="RT Critics" class="rating-icon">
                        <span class="rating-score" id="rtCriticScore">-</span>
                    </div>

                    <div class="rating-item" id="rtAudienceRating" style="display: none;">
                        <img id="rtAudienceIcon" src="/static/images/rotten-tomatoes-popcorn-good.png" alt="RT Audience" class="rating-icon">
                        <span class="rating-score" id="rtAudienceScore">-</span>
                    </div>

                    <div class="rating-item" id="metacriticRating" style="display: none;">
                        <img src="/static/images/metacritic.png" alt="Metacritic" class="rating-icon">
                        <span class="rating-score" id="metacriticScore">-</span>
                    </div>
                </div>

                <!-- Play/Action Button (like Add to Sonarr style) -->
                <button class="primary-action-button" id="primaryActionButton" onclick="handlePrimaryAction()" style="display: none;">
                    <i class="fas fa-play"></i>
                    <span>Watch</span>
                </button>

                <!-- Action Buttons Row (Plex-style circular icons) -->
                <div class="action-buttons-row" id="actionButtonsRow" style="display: none;">
                    <div class="action-btn-item" onclick="upgradeQuality()">
                        <div class="action-btn-circle">
                            <i class="fas fa-arrow-up"></i>
                        </div>
                        <span class="action-btn-label">Upgrade</span>
                    </div>
                    <div class="action-btn-item" onclick="openSourcesModal()">
                        <div class="action-btn-circle">
                            <i class="fas fa-download"></i>
                        </div>
                        <span class="action-btn-label">Sources</span>
                    </div>
                    <div class="action-btn-item" onclick="openReviewsModal()">
                        <div class="action-btn-circle">
                            <i class="fas fa-star"></i>
                        </div>
                        <span class="action-btn-label">Reviews</span>
                    </div>
                </div>

                <!-- Plot section -->
                <div class="plot-section">
                    <div class="plot-text" id="modalDescription">
                        Loading plot information...
                    </div>
                    <button class="more-button" id="moreButton" onclick="toggleSummary()" style="display: none;">
                        More
                    </button>
                </div>


                <!-- Cast & Crew Section (Director first, then cast) -->
                <div class="cast-section" id="castCrewSection" style="display: none;">
                    <h3 class="section-title">Cast & Crew</h3>
                    <div class="cast-grid" id="castCrewGrid">
                        <!-- Director(s) and cast members will be dynamically added here -->
                    </div>
                </div>

            </div>
        </div>

        <!-- Sources Drill-Down Container (screens are injected dynamically) -->
        <div id="sourcesContainer"></div>

        <!-- Reviews Full-Screen Modal -->
        <div class="action-modal" id="reviewsModal" style="display: none;">
            <div class="action-modal-header">
                <button class="action-modal-back" onclick="closeReviewsModal()">

                </div>
            </div>
        </div>
    </div>
</div>

<script>
// Movie Modal Functions
let currentMovie = null;

// ---------------------------------------------------------------------------
// UltraBlurColors — Plex-style colored background
// ---------------------------------------------------------------------------
async function fetchUltraBlurColors(movie) {
    // Reset to default first
    resetUltraBlurColors();

    const ratingKey = movie.rating_key;
    const tmdbId = movie.tmdb_id;
    if (!ratingKey && !tmdbId) return;

    try {
        // Try Plex UltraBlurColors first (works for owned movies)
        if (ratingKey) {
            const resp = await fetch(`/api/plex/ultrablur/${ratingKey}`);
            if (resp.ok) {
                const colors = await resp.json();
                if (colors.topLeft || colors.topRight || colors.bottomRight || colors.bottomLeft) {
                    applyUltraBlurColors(colors);
                    return;
                }
            }
        }

        // Fallback: extract colors from TMDb backdrop image
        if (tmdbId) {
            const resp = await fetch(`/api/tmdb/colors/${tmdbId}`);
            if (resp.ok) {
                const colors = await resp.json();
                if (colors.topLeft || colors.topRight || colors.bottomRight || colors.bottomLeft) {
                    applyUltraBlurColors(colors);
                    return;
                }
            }
        }
    } catch (e) {
        // Non-critical — keep default dark background
    }
}

function applyUltraBlurColors(colors) {
    const tl = colors.topLeft || '#1a1a1a';
    const tr = colors.topRight || '#1a1a1a';
    const br = colors.bottomRight || '#0f0f0f';
    const bl = colors.bottomLeft || '#0f0f0f';

    const overlay = document.querySelector('.movie-modal-overlay');
    const mockup = document.querySelector('.mockup');
    const backdropSection = document.querySelector('.backdrop-section');

    if (overlay) {
        overlay.style.backgroundColor = '#0a0a0a';
        overlay.style.backgroundImage = [
            `radial-gradient(circle at 0% 0%, ${tl}, transparent 70%)`,
            `radial-gradient(circle at 100% 0%, ${tr}, transparent 70%)`,
            `radial-gradient(circle at 100% 100%, ${br}, transparent 70%)`,
            `radial-gradient(circle at 0% 100%, ${bl}, transparent 70%)`,
        ].join(', ');
    }
    if (mockup) {
        mockup.style.background = 'none';
    }
    if (backdropSection) {
        backdropSection.style.webkitMaskImage = 'linear-gradient(to bottom, black 20%, transparent 100%)';
        backdropSection.style.maskImage = 'linear-gradient(to bottom, black 20%, transparent 100%)';
    }
}

function resetUltraBlurColors() {
    const overlay = document.querySelector('.movie-modal-overlay');
    const mockup = document.querySelector('.mockup');
    const backdropSection = document.querySelector('.backdrop-section');

    if (overlay) {
        overlay.style.backgroundColor = '';
        overlay.style.backgroundImage = '';
    }
    if (mockup) {
        mockup.style.background = '';
    }
    if (backdropSection) {
        backdropSection.style.webkitMaskImage = '';
        backdropSection.style.maskImage = '';
    }
}

function openMovieModal(movie, isOwned = true) {
    console.log('openMovieModal called with:', movie, 'isOwned:', isOwned);
    currentMovie = movie;
    currentMovie.isOwned = isOwned;
    currentMovie.inWatchlist = false;

    // Check if modal exists
    const modal = document.getElementById('movieModal');
    if (!modal) {
        console.error('Modal element not found!');
        return;
    }

    // Update primary action button based on ownership
    const primaryActionBtn = document.getElementById('primaryActionButton');
    const actionButtonsRow = document.getElementById('actionButtonsRow');

    // Reset sources/reviews modal state for new movie
    sourcesModalLoaded = false;
    window._cachedReviews = null;

    // Update corner watchlist button visibility
    const cornerWatchlistBtn = document.querySelector('.modal-watchlist-btn-backdrop');

    // Find the Upgrade button item inside the action row
    const upgradeActionItem = actionButtonsRow ? actionButtonsRow.querySelector('.action-btn-item:first-child') : null;

    if (isOwned) {
        // Owned movie - Show play button and action row with Upgrade visible
        if (primaryActionBtn) {
            primaryActionBtn.style.display = 'flex';
            primaryActionBtn.querySelector('i').className = 'fas fa-play';
            primaryActionBtn.querySelector('span').textContent = 'Watch';
            primaryActionBtn.onclick = handlePrimaryAction;
            primaryActionBtn.style.background = '#ffffff';
            primaryActionBtn.style.color = '#000000';
        }
        // Show action buttons row with Upgrade
        if (actionButtonsRow) actionButtonsRow.style.display = 'flex';
        if (upgradeActionItem) upgradeActionItem.style.display = 'flex';
        // Hide corner watchlist button for owned movies
        if (cornerWatchlistBtn) cornerWatchlistBtn.style.display = 'none';
    } else {
        // Not owned - Show "Add to Watchlist" button initially
        if (primaryActionBtn) {
            primaryActionBtn.style.display = 'flex';
            primaryActionBtn.querySelector('i').className = 'fas fa-plus';
            primaryActionBtn.querySelector('span').textContent = 'Add to Watchlist';
            primaryActionBtn.onclick = handlePrimaryAction;
            primaryActionBtn.style.background = '';
            primaryActionBtn.style.pointerEvents = 'auto';
        }
        // Show action buttons row but hide Upgrade for unowned
        if (actionButtonsRow) actionButtonsRow.style.display = 'flex';
        if (upgradeActionItem) upgradeActionItem.style.display = 'none';
        // Hide corner watchlist button
        if (cornerWatchlistBtn) cornerWatchlistBtn.style.display = 'none';

        // Check if movie is already in watchlist (async)
        if (movie.tmdb_id) {
            checkWatchlistStatus(movie.tmdb_id, primaryActionBtn);
        }
    }

    // Update modal content
    document.getElementById('modalTitle').textContent = movie.title || 'Unknown Title';
    document.getElementById('stickyHeaderTitle').textContent = movie.title || 'Unknown Title';

    // Meta info
    document.getElementById('modalYear').textContent = movie.year || '';
    document.getElementById('modalRuntime').textContent = movie.duration ? formatDuration(movie.duration) : '';
    document.getElementById('modalRating').textContent = movie.content_rating || '';

    // Description with collapse functionality (3 lines max)
    const descriptionElement = document.getElementById('modalDescription');
    const moreButton = document.getElementById('moreButton');
    const summary = movie.summary || 'No summary available.';

    descriptionElement.textContent = summary;

    // Always start collapsed
    descriptionElement.classList.add('collapsed');

    // Check if content overflows 3 lines after render
    setTimeout(() => {
        const isOverflowing = descriptionElement.scrollHeight > descriptionElement.clientHeight;
        if (isOverflowing) {
            moreButton.style.display = 'block';
            moreButton.textContent = 'More';
        } else {
            // Content fits in 3 lines, no need for button
            descriptionElement.classList.remove('collapsed');
            moreButton.style.display = 'none';
        }
    }, 0);

    // Genres (inline text, first 2 only)
    const genresContainer = document.getElementById('modalGenres');
    if (movie.genres && movie.genres.length > 0) {
        // Handle both string array and object array formats
        const genresList = Array.isArray(movie.genres)
            ? movie.genres.map(g => typeof g === 'string' ? g : g.tag || g.name || g)
            : [];

        if (genresList.length > 0) {
            // Show only first 2 genres as text
            const firstTwoGenres = genresList.slice(0, 2).join(', ');
            genresContainer.textContent = firstTwoGenres;
        } else {
            genresContainer.textContent = '';
        }
    } else {
        genresContainer.textContent = '';
    }

    // Populate Cast & Crew Section (Director first, then cast)
    const castCrewSection = document.getElementById('castCrewSection');
    const castCrewGrid = document.getElementById('castCrewGrid');
    castCrewGrid.innerHTML = '';

    // Helper: create a person element (used for both directors and cast)
    function createPersonElement(person, role, clickId) {
        const el = document.createElement('div');
        el.className = 'cast-member';

        let finalPhotoUrl = '';
        if (person.profile_path) {
            finalPhotoUrl = `https://image.tmdb.org/t/p/w185${person.profile_path}`;
        } else if (person.thumb && (person.thumb.startsWith('http') || person.thumb.startsWith('//'))) {
            finalPhotoUrl = person.thumb;
        } else if (person.photo && (person.photo.startsWith('http') || person.photo.startsWith('//'))) {
            finalPhotoUrl = person.photo;
        }

        const personName = person.tag || person.name || 'Unknown';

        el.innerHTML = `
            <img class="cast-photo" src="${finalPhotoUrl}" alt="${personName}" onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ccircle cx=%2250%22 cy=%2250%22 r=%2250%22 fill=%22%23333%22/%3E%3Cpath d=%22M50 45c8.3 0 15-6.7 15-15s-6.7-15-15-15-15 6.7-15 15 6.7 15 15 15zm0 7.5c-12.5 0-37.5 6.3-37.5 18.8v9.4h75v-9.4c0-12.5-25-18.8-37.5-18.8z%22 fill=%22%23666%22/%3E%3C/svg%3E'">
            <div class="cast-name">${personName}</div>
            <div class="cast-character">${role}</div>
        `;

        el.style.cursor = 'pointer';
        el.onclick = function() {
            closeMovieModal();
            const pid = person.director_id || person.actor_id;
            const tmdbPid = person.tmdb_person_id || person.id;
            if (pid) {
                window.location.href = `/library?actor=${encodeURIComponent(personName)}&actor_id=${pid}`;
            } else if (tmdbPid) {
                window.location.href = `/library?actor=${encodeURIComponent(personName)}&tmdb_person_id=${tmdbPid}`;
            } else {
                window.location.href = `/library?search=${encodeURIComponent(personName)}&filter=people`;
            }
        };

        return el;
    }

    // Render the full Cast & Crew grid
    function renderCastCrew() {
        castCrewGrid.innerHTML = '';
        let hasContent = false;

        // Directors first
        if (movie.directors && movie.directors.length > 0) {
            movie.directors.forEach(d => {
                castCrewGrid.appendChild(createPersonElement(d, 'Director'));
            });
            hasContent = true;
        }

        // Then cast
        if (movie.cast && movie.cast.length > 0) {
            const castToShow = movie.cast.slice(0, 10);
            castToShow.forEach(actor => {
                castCrewGrid.appendChild(createPersonElement(actor, actor.role || actor.character || ''));
            });
            hasContent = true;
        }

        castCrewSection.style.display = hasContent ? 'block' : 'none';
    }

    // Render with whatever data we have now
    renderCastCrew();

    // If no directors yet, try fetching from TMDB
    if ((!movie.directors || movie.directors.length === 0) && movie.tmdb_id) {
        fetch(`/api/movie/${movie.tmdb_id}`)
            .then(response => response.ok ? response.json() : null)
            .then(data => {
                if (data && data.credits && data.credits.crew) {
                    const directors = data.credits.crew
                        .filter(person => person.job === 'Director')
                        .map(d => ({ name: d.name, profile_path: d.profile_path, tmdb_person_id: d.id }));
                    if (directors.length > 0) {
                        movie.directors = directors;
                        renderCastCrew();
                    }
                }
            })
            .catch(err => console.log('Could not fetch directors:', err));
    }

    // Set backdrop (use backdrop_url if available, otherwise use poster as fallback)
    const backdropImg = document.getElementById('modalBackdropImage');
    if (movie.backdrop_url) {
        backdropImg.src = movie.backdrop_url;
        backdropImg.style.opacity = '0.7';
    } else if (movie.poster_url && !movie.poster_url.includes('placeholder')) {
        backdropImg.src = movie.poster_url;
        backdropImg.style.opacity = '0.6';
    } else {
        backdropImg.style.opacity = '0';
    }

    // Set clearlogo if available
    const clearlogoImg = document.getElementById('modalClearlogo');
    const clearlogoFallback = document.getElementById('modalClearlogoFallback');
    if (movie.clearlogo_url) {
        clearlogoImg.src = movie.clearlogo_url;
        clearlogoImg.style.display = 'block';
        clearlogoFallback.style.display = 'none';
        // Hide title in bottom section if we have a clearlogo
        document.getElementById('modalTitle').style.display = 'none';
    } else {
        // No clearlogo, show title in the clearlogo container
        clearlogoImg.style.display = 'none';
        clearlogoFallback.textContent = movie.title || 'Unknown Title';
        clearlogoFallback.style.display = 'block';
        // Also hide the title in the bottom section to avoid duplication
        document.getElementById('modalTitle').style.display = 'none';
    }

    // Reset ratings (hide all initially)
    document.getElementById('imdbRating').style.display = 'none';
    document.getElementById('rtCriticRating').style.display = 'none';
    document.getElementById('rtAudienceRating').style.display = 'none';
    document.getElementById('metacriticRating').style.display = 'none';

    // Fetch ratings - either from Plex or TMDB
    if (movie.rating_key) {
        // Owned movie - fetch from Plex
        fetchRatings(movie.rating_key);
    } else if (movie.tmdb_id) {
        // TMDB movie - fetch from TMDB/OMDB
        fetchTmdbRatings(movie.tmdb_id, movie.title, movie.year);
    }

    // Fetch UltraBlurColors from Plex for colored background
    fetchUltraBlurColors(movie);

    // Pre-fetch RT reviews (cached for Reviews modal)
    fetchRTReviews(movie.title, movie.year);

    // Show modal
    console.log('Showing modal...');
    document.getElementById('movieModal').style.display = 'block';
    document.body.classList.add('modal-open');
    console.log('Modal display style:', document.getElementById('movieModal').style.display);

    // Scroll to top
    const modalOverlay = document.querySelector('.movie-modal-overlay');
    modalOverlay.scrollTop = 0;

    // Setup scroll listener for sticky header
    modalOverlay.addEventListener('scroll', handleModalScroll);
}

async function fetchRatings(ratingKey) {
    try {
        // Fetch ratings from Plex database
        const response = await fetch(`/api/plex/ratings/${ratingKey}`);

        if (response.ok) {
            const data = await response.json();
            console.log('Ratings data:', data);

            // Display IMDB rating
            if (data.imdb) {
                document.getElementById('imdbScore').textContent = data.imdb.score;
                document.getElementById('imdbRating').style.display = 'flex';
            }

            // Display Rotten Tomatoes Critic score (Tomatometer)
            if (data.rotten_tomatoes_critic) {
                const score = data.rotten_tomatoes_critic.score;
                document.getElementById('rtCriticScore').textContent = `${score}%`;

                // Use splat icon for rotten (<60%), fresh tomato for fresh
                const iconElement = document.getElementById('rtCriticIcon');
                if (score < 60) {
                    iconElement.src = '/static/images/rotten-tomatoes-splat.png';
                } else {
                    iconElement.src = '/static/images/rotten-tomatoes-logo.png';
                }

                document.getElementById('rtCriticRating').style.display = 'flex';
            }

            // Display Rotten Tomatoes Audience score (Popcorn)
            if (data.rotten_tomatoes_audience) {
                const score = data.rotten_tomatoes_audience.score;
                document.getElementById('rtAudienceScore').textContent = `${score}%`;

                // Use spilled popcorn for bad (<60%), upright popcorn for good
                const iconElement = document.getElementById('rtAudienceIcon');
                if (score < 60) {
                    iconElement.src = '/static/images/rotten-tomatoes-popcorn-bad.png';
                } else {
                    iconElement.src = '/static/images/rotten-tomatoes-popcorn-good.png';
                }

                document.getElementById('rtAudienceRating').style.display = 'flex';
            }

            // Display Metacritic score
            if (data.metacritic) {
                document.getElementById('metacriticScore').textContent = data.metacritic.score;
                document.getElementById('metacriticRating').style.display = 'flex';
            }

            // Display TMDB rating (if no other ratings available)
            if (data.tmdb && !data.imdb && !data.rotten_tomatoes_critic) {
                // Use IMDB slot for TMDB rating for now
                document.getElementById('imdbScore').textContent = data.tmdb.score;
                document.getElementById('imdbRating').style.display = 'flex';
            }
        }
    } catch (error) {
        console.error('Failed to fetch ratings from Plex:', error);
    }
}

async function fetchTmdbRatings(tmdbId, title, year) {
    try {
        // For TMDB movies, we can show TMDB rating directly
        const tmdbResponse = await fetch(`https://api.themoviedb.org/3/movie/${tmdbId}?api_key={{ tmdb_api_key }}`);
        if (tmdbResponse.ok) {
            const tmdbData = await tmdbResponse.json();
            if (tmdbData.vote_average) {
                document.getElementById('imdbScore').textContent = tmdbData.vote_average.toFixed(1);
                document.getElementById('imdbRating').style.display = 'flex';
            }
        }

        // Optionally fetch from OMDB for more detailed ratings
        if (title && year) {
            const omdbResponse = await fetch(`/api/ratings/${encodeURIComponent(title)}?year=${year}`);
            if (omdbResponse.ok) {
                const omdbData = await omdbResponse.json();

                // Display IMDb rating if available
                if (omdbData.imdb && omdbData.imdb.score) {
                    document.getElementById('imdbScore').textContent = omdbData.imdb.score;
                    document.getElementById('imdbRating').style.display = 'flex';
                }

                // Display RT ratings if available
                if (omdbData.rotten_tomatoes_critic) {
                    const score = parseInt(omdbData.rotten_tomatoes_critic.score);
                    document.getElementById('rtCriticScore').textContent = `${score}%`;
                    const iconElement = document.getElementById('rtCriticIcon');
                    if (score < 60) {
                        iconElement.src = '/static/images/rotten-tomatoes-splat.png';
                    } else {
                        iconElement.src = '/static/images/rotten-tomatoes-logo.png';
                    }
                    document.getElementById('rtCriticRating').style.display = 'flex';
                }

                if (omdbData.metacritic && omdbData.metacritic.score) {
                    document.getElementById('metacriticScore').textContent = omdbData.metacritic.score;
                    document.getElementById('metacriticRating').style.display = 'flex';
                }
            }
        }
    } catch (error) {
        console.error('Failed to fetch TMDB ratings:', error);
    }
}

// RT Reviews Functions
async function fetchRTReviews(title, year) {
    console.log('fetchRTReviews called with:', title, year);
    window._cachedReviews = null;

    try {
        const params = new URLSearchParams({ title: title });
        if (year) params.append('year', year);
        params.append('limit', '20');

        const response = await fetch(`/api/rt/reviews?${params.toString()}`);

        if (!response.ok) throw new Error('Failed to fetch reviews');

        const data = await response.json();

        if (!data.success) {
            console.log('RT reviews: No reviews found for this movie');
            window._cachedReviews = false; // Signal: fetch done, no reviews
            return;
        }

        // Cache review data for the Reviews modal
        window._cachedReviews = data;
        console.log('RT reviews cached successfully');

    } catch (error) {
        console.error('Failed to fetch RT reviews:', error);
        window._cachedReviews = false; // Signal: fetch done, failed
    }
}

function createCriticReviewCard(review) {
    const card = document.createElement('div');
    card.className = 'rt-review-card';

    const freshIcon = review.fresh
        ? '/static/images/rotten-tomatoes-logo.png'
        : '/static/images/rotten-tomatoes-splat.png';

    // Build score display if available
    let scoreHtml = '';
    if (review.score) {
        scoreHtml = `<span class="rt-review-score">${escapeHtml(review.score)}</span>`;
    }

    card.innerHTML = `
        <p class="rt-review-quote">"${escapeHtml(review.quote)}"</p>
        <div class="rt-review-meta">
            <span class="rt-review-author">
                ${escapeHtml(review.critic)}
                ${review.publication ? `<span class="publication">- ${escapeHtml(review.publication)}</span>` : ''}
            </span>
            <div class="rt-review-rating-info">
                ${scoreHtml}
                <img class="rt-review-freshness" src="${freshIcon}" alt="${review.fresh ? 'Fresh' : 'Rotten'}">
            </div>
        </div>
    `;

    return card;
}

function createAudienceReviewCard(review) {
    const card = document.createElement('div');
    card.className = 'rt-review-card';

    let ratingHtml = '';
    if (review.rating !== null && review.rating !== undefined) {
        const stars = '★'.repeat(Math.round(review.rating));
        ratingHtml = `<span class="rt-review-rating">${stars} ${review.rating}/5</span>`;
    }

    card.innerHTML = `
        <p class="rt-review-quote">"${escapeHtml(review.quote)}"</p>
        <div class="rt-review-meta">
            <span class="rt-review-author">${escapeHtml(review.user)}</span>
            ${ratingHtml}
        </div>
    `;

    return card;
}

function escapeHtml(text) {
    if (!text) return '';
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
}

            media_type: currentMovie.media_type || 'movie',

            poster_path: currentMovie.poster_path,
            imdb_id: currentMovie.imdb_id,
            quality_profile: qualityProfileName  // Pass the Radarr quality profile name
        };

        const response = await fetch('/api/watchlist', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify(data)
        });

        const result = await response.json();

        if (response.ok) {
            // Mark movie as in watchlist
            currentMovie.inWatchlist = true;
            currentMovie.watchlistQuality = qualityProfileName;

            // Update UI to show it's in watchlist
            const watchlistBtn = document.querySelector('.modal-watchlist-btn-backdrop');

            if (watchlistBtn) {
                watchlistBtn.classList.add('active');
                const icon = watchlistBtn.querySelector('i');
                icon.classList.remove('far');

            if (isUpgrade && currentMovie.isOwned) {
                showToast('Added to Radarr!', 'success');

                // For non-owned movies, show "In Watchlist" on primary button
                primaryBtn.innerHTML = '<i class="fas fa-clock"></i><span>In Watchlist</span>';
                primaryBtn.style.background = 'linear-gradient(135deg, rgba(255, 152, 0, 0.9), rgba(245, 124, 0, 0.8))';

            if (result.already_exists) {
                currentMovie.inWatchlist = true;

                    showToast('Already in Radarr', 'success');

                    targetBtn.style.background = 'rgba(244, 67, 54, 0.8)';

                        targetBtn.style.background = '';
                        targetBtn.style.pointerEvents = 'auto';

                    showToast('Failed to add to Radarr', 'error');
                }

        }
    } catch (error) {
        console.error('Error adding to watchlist:', error);
        if (targetBtn) {
            targetBtn.innerHTML = '<i class="fas fa-times"></i><span>Error - Try Again</span>';
            targetBtn.style.background = 'rgba(244, 67, 54, 0.8)';

// Sources modal functionality
let sourcesModalLoaded = false;

// Helper: extract resolution from Radarr quality name or title
// --- Sources Drill-Down (kiosk-style 4-level) ---

const BADGE_PALETTE = [
    { bg: 'rgba(187, 134, 252, 0.15)', fg: '#bb86fc', border: 'rgba(187, 134, 252, 0.3)' },
    { bg: 'rgba(96, 165, 250, 0.15)',  fg: '#60a5fa', border: 'rgba(96, 165, 250, 0.3)' },
    { bg: 'rgba(52, 211, 153, 0.15)',  fg: '#34d399', border: 'rgba(52, 211, 153, 0.3)' },
    { bg: 'rgba(251, 191, 36, 0.15)',  fg: '#fbbf24', border: 'rgba(251, 191, 36, 0.3)' },
    { bg: 'rgba(248, 113, 113, 0.15)', fg: '#f87171', border: 'rgba(248, 113, 113, 0.3)' },
    { bg: 'rgba(45, 212, 191, 0.15)',  fg: '#2dd4bf', border: 'rgba(45, 212, 191, 0.3)' },
    { bg: 'rgba(244, 114, 182, 0.15)', fg: '#f472b6', border: 'rgba(244, 114, 182, 0.3)' },
    { bg: 'rgba(163, 230, 53, 0.15)',  fg: '#a3e635', border: 'rgba(163, 230, 53, 0.3)' },
];
const _badgeColorCache = {};
function getBadgeColor(indexer) {
    if (_badgeColorCache[indexer]) return _badgeColorCache[indexer];
    const idx = Object.keys(_badgeColorCache).length % BADGE_PALETTE.length;
    _badgeColorCache[indexer] = BADGE_PALETTE[idx];
    return _badgeColorCache[indexer];
}

function extractResolution(qualityName, title) {
    const match = (qualityName || '').match(/(\d{3,4}p)/i);
    if (match) return match[1];
    const titleMatch = (title || '').match(/(\d{3,4}p)/i);
    if (titleMatch) return titleMatch[1];
    return 'Unknown';
}

function getSourceType(name) {
    const upper = (name || '').toUpperCase();
    if (upper.includes('REMUX')) return 'REMUX';
    if (upper.includes('WEB')) return 'WEB-DL';
    if (upper.includes('BLURAY') || upper.includes('BLU-RAY') || upper.includes('BDRIP') || upper.includes('BD')) return 'BluRay';
    return 'Other';
}

function buildQualityGroups(releases) {
    const grouped = {};
    for (const r of releases) {
        if (!grouped[r.resolution]) grouped[r.resolution] = {};
        if (!grouped[r.resolution][r.sourceType]) grouped[r.resolution][r.sourceType] = [];
        grouped[r.resolution][r.sourceType].push(r);
    }
    const qualityOrder = ['2160p', '1080p', '720p', '480p', 'Unknown'];
    const sourceTypeOrder = ['REMUX', 'WEB-DL', 'BluRay', 'Other'];
    const sortedQualities = Object.keys(grouped).sort((a, b) => {
        const aIdx = qualityOrder.indexOf(a);
        const bIdx = qualityOrder.indexOf(b);
        return (aIdx === -1 ? 999 : aIdx) - (bIdx === -1 ? 999 : bIdx);
    });
    return sortedQualities.map(quality => {
        const sourceTypes = grouped[quality];
        const sortedTypes = Object.keys(sourceTypes).sort((a, b) => {
            const aIdx = sourceTypeOrder.indexOf(a);
            const bIdx = sourceTypeOrder.indexOf(b);
            return (aIdx === -1 ? 999 : aIdx) - (bIdx === -1 ? 999 : bIdx);
        });
        const totalCount = Object.values(sourceTypes).reduce((sum, arr) => sum + arr.length, 0);
        return {
            quality,
            totalCount,
            sourceTypes: sortedTypes.map(type => ({
                type,
                items: sourceTypes[type].sort((a, b) => b.seeders - a.seeders),
            })),
        };
    });
}

async function loadSourcesForModal() {
    // Show loading screen
    const container = document.getElementById('sourcesContainer');
    container.innerHTML = '';
    const screen = createSourcesScreen(100001);
    const center = document.createElement('div');
    center.style.cssText = 'display:flex;flex-direction:column;align-items:center;gap:20px;color:rgba(255,255,255,0.5);font-size:18px;position:relative;z-index:1;';
    center.innerHTML = '<div style="width:36px;height:36px;border:3px solid rgba(255,255,255,0.15);border-top-color:rgba(255,255,255,0.7);border-radius:50%;animation:spin 0.8s linear infinite"></div>Searching for sources...';
    screen.appendChild(center);
    container.appendChild(screen);

    const movie = currentMovie;
    const params = new URLSearchParams();
    if (movie.tmdb_id) params.set('tmdb_id', String(movie.tmdb_id));
    if (movie.title) params.set('title', movie.title);
    if (movie.year) params.set('year', String(movie.year));

    try {
        const response = await fetch(`/api/radarr/movie/releases?${params.toString()}`);
        if (!response.ok) throw new Error('Radarr error');
        const data = await response.json();
        _sourcesMovieId = data.movie_id || 0;

        _sourcesReleases = [];
        if (data.releases && data.releases.length > 0) {
            _sourcesReleases = data.releases
                .map(r => {
                    const title = r.title || '';
                    const qualityName = r.quality || '';
                    const resolution = extractResolution(qualityName, title);
                    const sourceType = getSourceType(title);
                    const size = r.size || 0;
                    const sizeGb = size ? (size / (1024 * 1024 * 1024)).toFixed(2) : null;
                    return {
                        guid: r.guid || '',
                        title: title,
                        indexer: r.indexer || 'Unknown',
                        indexerId: r.indexer_id || r.indexerId || 0,
                        size: size,
                        seeders: r.seeders || 0,
                        leechers: r.leechers || 0,
                        quality: qualityName,
                        customFormatScore: r.custom_format_score || r.customFormatScore || 0,
                        age: r.age != null ? r.age : null,
                        protocol: r.protocol || 'torrent',
                        resolution: resolution,
                        sourceType: sourceType,
                        sizeGb: sizeGb,
                    };
                });
        }

        // Replace loading screen with level 1
        container.innerHTML = '';

        if (_sourcesReleases.length === 0) {
            const emptyScreen = createSourcesScreen(100001);
            const emptyMsg = document.createElement('div');
            emptyMsg.style.cssText = 'color:rgba(255,255,255,0.5);font-size:18px;position:relative;z-index:1;';
            emptyMsg.textContent = 'No sources found';
            emptyScreen.appendChild(emptyMsg);
            container.appendChild(emptyScreen);
            return;
        }

        sourcesPushLevel1();
    } catch (e) {
        console.error('Failed to load sources:', e);
        container.innerHTML = '';
        const errScreen = createSourcesScreen(100001);
        const errMsg = document.createElement('div');
        errMsg.style.cssText = 'color:rgba(255,255,255,0.5);font-size:18px;position:relative;z-index:1;';
        errMsg.textContent = 'Failed to load sources';
        errScreen.appendChild(errMsg);
        container.appendChild(errScreen);
    }
}

function sourcesPushLevel1() {
    const container = document.getElementById('sourcesContainer');
    // Clear everything and build base level
    container.innerHTML = '';

    const qualityGroups = buildQualityGroups(_sourcesReleases);
    const screen = createSourcesScreen(100001);

    const panel = _createTilePanel();
    qualityGroups.forEach(group => {
        const tile = document.createElement('button');
        tile.className = 'sources-tile';
        tile.innerHTML = `<span class="sources-tile-label">${group.quality}</span><span class="sources-tile-count">${group.totalCount} sources</span>`;
        tile.onclick = () => sourcesPushLevel2(group.quality);
        panel.appendChild(tile);
    });

    screen.appendChild(panel);
    container.appendChild(screen);
}

function sourcesPushLevel2(quality) {
    const container = document.getElementById('sourcesContainer');
    const qualityGroups = buildQualityGroups(_sourcesReleases);
    const selectedGroup = qualityGroups.find(g => g.quality === quality);
    if (!selectedGroup) return;

    const screen = createSourcesScreen(100002);

    const panel = _createTilePanel();
    selectedGroup.sourceTypes.forEach(st => {
        const tile = document.createElement('button');
        tile.className = 'sources-tile';
        tile.innerHTML = `<span class="sources-tile-label">${st.type}</span><span class="sources-tile-count">${st.items.length} sources</span>`;
        tile.onclick = () => sourcesPushLevel3(quality, st.type);
        panel.appendChild(tile);
    });

    screen.appendChild(panel);
    container.appendChild(screen);
}

function sourcesPushLevel3(quality, sourceType) {
    const container = document.getElementById('sourcesContainer');
    const qualityGroups = buildQualityGroups(_sourcesReleases);
    const selectedGroup = qualityGroups.find(g => g.quality === quality);
    if (!selectedGroup) return;
    const selectedST = selectedGroup.sourceTypes.find(st => st.type === sourceType);
    if (!selectedST) return;

    const screen = createSourcesScreen(100003);

    const listWrap = document.createElement('div');
    listWrap.style.cssText = 'flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;width:100%;max-width:600px;padding-top:10px;position:relative;z-index:1;';

    const list = document.createElement('div');
    list.style.cssText = 'display:flex;flex-direction:column;gap:10px;';

    selectedST.items.forEach(release => {
        const ageDays = release.age != null ? Math.round(release.age) : null;
        const badge = getBadgeColor(release.indexer);

        const item = document.createElement('div');
        item.className = 'sources-release-item';
        item.onclick = () => sourcesPushLevel4(release);

        item.innerHTML = `
            <div style="display:flex;align-items:flex-start;gap:10px;margin-bottom:4px">
                <span class="sources-release-badge" style="background:${badge.bg};color:${badge.fg};border:1px solid ${badge.border}">${release.indexer}</span>
            </div>
            <div class="sources-release-title">${release.title}</div>
            <div class="sources-release-stats">
                <span style="color:#fff;font-weight:600;text-align:left">${release.sizeGb ? release.sizeGb + ' GB' : '—'}</span>
                <span style="color:#ccc;text-align:center">${ageDays != null ? ageDays + 'd ago' : '—'}</span>
                <span style="color:#4ade80;text-align:right;font-weight:600">${release.seeders} seeders</span>
            </div>
        `;

        list.appendChild(item);
    });

    listWrap.appendChild(list);
    screen.appendChild(listWrap);
    container.appendChild(screen);
}

function sourcesPushLevel4(release) {
    _sourcesConfirmTarget = release;
    const container = document.getElementById('sourcesContainer');
    const badge = getBadgeColor(release.indexer);

    const screen = createSourcesScreen(100004);

    // Centered content wrapper
    const wrap = document.createElement('div');
    wrap.style.cssText = 'display:flex;flex-direction:column;align-items:center;position:relative;z-index:1;';

    // Badge above card
    const badgeEl = document.createElement('span');
    badgeEl.className = 'sources-release-badge';
    badgeEl.style.cssText = `padding:6px 18px;border-radius:12px;font-size:15px;margin-bottom:16px;background:${badge.bg};color:${badge.fg};border:1px solid ${badge.border}`;
    badgeEl.textContent = release.indexer;
    wrap.appendChild(badgeEl);

    // Confirm card
    const card = document.createElement('div');
    card.className = 'sources-confirm-card';
    card.innerHTML = `
        <p style="margin:0 0 14px;font-size:14px;font-weight:500;color:#fff;line-height:1.5;word-break:break-word;text-align:center">${release.title}</p>
        <div style="display:flex;gap:16px;font-size:14px;justify-content:center;flex-wrap:wrap;margin-bottom:24px">
            <span style="color:#fff;font-weight:600">${release.sizeGb ? release.sizeGb + ' GB' : '—'}</span>
            <span style="color:#ccc">${release.seeders} seeders</span>
        </div>
        <div style="display:flex;gap:14px;justify-content:center">
            <button class="sources-confirm-cancel" onclick="sourcesGoBack()">Cancel</button>
            <button class="sources-confirm-download" id="sourcesDownloadBtn" onclick="handleSourcesDownload()">Download</button>
        </div>
    `;
    wrap.appendChild(card);
    screen.appendChild(wrap);
    container.appendChild(screen);
}

async function handleSourcesDownload() {
    if (!_sourcesConfirmTarget || _sourcesConfirmLoading) return;
    _sourcesConfirmLoading = true;

    const btn = document.getElementById('sourcesDownloadBtn');
    if (btn) {
        btn.textContent = 'Sending...';
        btn.style.opacity = '0.7';
        btn.disabled = true;
    }

    try {
        const resp = await fetch('/api/radarr/movie/grab', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                guid: _sourcesConfirmTarget.guid,
                indexer_id: _sourcesConfirmTarget.indexerId,
                movie_id: _sourcesMovieId,
            }),
        });

        if (resp.ok) {
            showToast('Download started', 'success');
            closeSourcesModal();
        } else {
            const data = await resp.json().catch(() => ({}));
            showToast(data.error || 'Failed to grab release', 'error');
            _sourcesConfirmLoading = false;
            if (btn) {
                btn.textContent = 'Download';
                btn.style.opacity = '1';
                btn.disabled = false;
            }
        }
    } catch (e) {
        console.error('Grab failed:', e);
        showToast('Failed to grab release', 'error');
        _sourcesConfirmLoading = false;
        if (btn) {
            btn.textContent = 'Download';
            btn.style.opacity = '1';
            btn.disabled = false;
        }
    }
}

// --- Reviews Modal ---
function openReviewsModal() {
    document.getElementById('reviewsModal').style.display = 'flex';
    renderReviewsInModal();
}

function closeReviewsModal() {
    document.getElementById('reviewsModal').style.display = 'none';
}

function renderReviewsInModal() {
    const content = document.getElementById('reviewsModalContent');
    const loading = document.getElementById('reviewsModalLoading');
    const empty = document.getElementById('reviewsModalEmpty');

    if (window._cachedReviews) {
        loading.style.display = 'none';
        empty.style.display = 'none';
        content.innerHTML = '';

        const data = window._cachedReviews;

        // Critic Reviews
        if (data.critic_reviews && data.critic_reviews.length > 0) {
            const subtitle = document.createElement('h4');
            subtitle.className = 'rt-reviews-subtitle';
            subtitle.textContent = 'Critic Reviews';
            content.appendChild(subtitle);

            const list = document.createElement('div');
            list.className = 'rt-reviews-list';
            data.critic_reviews.forEach(review => {
                list.appendChild(createCriticReviewCard(review));
            });
            content.appendChild(list);
        }

        // Audience Reviews
        if (data.audience_reviews && data.audience_reviews.length > 0) {
            const subtitle = document.createElement('h4');
            subtitle.className = 'rt-reviews-subtitle';
            subtitle.textContent = 'Audience Reviews';
            content.appendChild(subtitle);

            const list = document.createElement('div');
            list.className = 'rt-reviews-list';
            data.audience_reviews.forEach(review => {
                list.appendChild(createAudienceReviewCard(review));
            });
            content.appendChild(list);
        }

        // RT Link
        if (data.reviews_url || data.url) {
            const link = document.createElement('a');
            link.className = 'rt-link';
            link.href = data.reviews_url || data.url;
            link.target = '_blank';
            link.rel = 'noopener noreferrer';
            link.innerHTML = 'Read Reviews on Rotten Tomatoes <i class="fas fa-external-link-alt"></i>';
            content.appendChild(link);
        }

        if (content.children.length === 0) {
            empty.style.display = 'block';
        }
    } else if (window._cachedReviews === false) {
        // Fetch completed but no reviews found or failed
        loading.style.display = 'none';
        content.innerHTML = '';
        empty.style.display = 'block';
    } else {
        // Reviews not yet cached (null) — show loading and poll
        loading.style.display = 'block';
        content.innerHTML = '';
        empty.style.display = 'none';

        const pollInterval = setInterval(() => {
            if (window._cachedReviews && window._cachedReviews !== false) {
                clearInterval(pollInterval);
                renderReviewsInModal();
            } else if (window._cachedReviews === false) {
                clearInterval(pollInterval);
                loading.style.display = 'none';
                empty.style.display = 'block';
            }
        }, 500);

        // Timeout after 15 seconds
        setTimeout(() => {
            clearInterval(pollInterval);
            if (!window._cachedReviews) {
                loading.style.display = 'none';
                empty.style.display = 'block';
            }
        }, 15000);
    }
}


// Close modal on escape key
document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') {
        // Sources drill-down: go back one level
        if (isSourcesOpen()) {
            e.stopPropagation();
            sourcesGoBack();
        } else if (document.getElementById('reviewsModal').style.display === 'flex') {
            closeReviewsModal();
        } else if (document.getElementById('movieModal').style.display === 'block') {
            closeMovieModal();
        }
    }
});
</script>
