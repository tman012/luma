<!-- Playback Room Selection Modal -->

<!-- NOTE: playback-service.js must be loaded by the page AFTER setting window.API_KEY -->
<div class="playback-modal" id="playbackModal" style="display: none;">
    <div class="playback-modal-overlay" onclick="closePlaybackModal()"></div>
    <div class="playback-modal-content" id="playbackModalContent">
        <div class="playback-backdrop" id="playbackBackdrop"></div>

<script>
let currentPlaybackRatingKey = null;
let currentPlaybackRoomId = null;
let currentPlaybackRoomName = null;
let currentResumeInfo = null;
let currentPlaybackTitle = null;
let currentPlaybackBackdropUrl = null;
let currentPlaybackLogoUrl = null;
let currentPlaybackDuration = null;
let currentPlaybackEpisodeTitle = null;
let currentPlaybackSeasonEpisode = null;
let currentPlaybackClientIp = null;
let currentPlaybackMovieData = null;


// Plex server machine identifier for deep links
const PLEX_MACHINE_ID = 'a6ce22ee1305ed380244886f494bb43c97bbf227';

// Detect mobile device (phone or tablet)
function isMobileDevice() {
    const ua = navigator.userAgent || navigator.vendor || window.opera;
    // Check for phone/tablet user agents
    if (/android/i.test(ua) && /mobile/i.test(ua)) return true;  // Android phone
    if (/android/i.test(ua) && !/mobile/i.test(ua)) return true;  // Android tablet
    if (/iPad|iPhone|iPod/.test(ua)) return true;  // iOS
    if (/iPad/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1)) return true;  // iPadOS
    // Also check screen size as fallback for PWAs
    if ('ontouchstart' in window && window.innerWidth <= 1024) return true;
    return false;
}

// Build Plex web player URL (browser-based playback)
function buildPlexWebUrl(ratingKey, viewOffset) {
    let url = 'https://app.plex.tv/desktop/#!/server/' + PLEX_MACHINE_ID + '/playback?key=%2Flibrary%2Fmetadata%2F' + ratingKey + '&context=library';
    if (viewOffset && viewOffset > 0) {
        url += '&viewOffset=' + viewOffset;
    }
    return url;
}

// Handle "Watch on this device" tap — opens Plex web player in browser
async function playOnThisDevice() {
    const btn = document.getElementById('playbackMobileBtn');
    const ratingKey = currentPlaybackRatingKey;

    if (!ratingKey) return;

    // Show loading state on button
    btn.innerHTML = '<span class="mobile-btn-icon"><div class="spinner" style="width:24px;height:24px;border-width:2px;margin:0;"></div></span><span class="mobile-btn-text">Opening Plex...</span><span class="mobile-btn-arrow"></span>';

    try {
        // Check for resume point first
        const resumeInfo = await window.playbackService.getResumeInfo(ratingKey);
        const viewOffset = (resumeInfo && resumeInfo.has_resume_point) ? resumeInfo.offset_ms : 0;

        const webUrl = buildPlexWebUrl(ratingKey, viewOffset);
        console.log('[PlaybackModal] Opening Plex web player:', webUrl);

        // Open in a new tab
        window.open(webUrl, '_blank');

        // Show success
        btn.innerHTML = '<span class="mobile-btn-icon">✅</span><span class="mobile-btn-text">Opened in Plex</span><span class="mobile-btn-arrow"></span>';
        setTimeout(() => closePlaybackModal(), 1500);

    } catch (error) {
        console.error('[PlaybackModal] Web player error:', error);
        // Try with no offset on error
        const webUrl = buildPlexWebUrl(ratingKey, 0);
        window.open(webUrl, '_blank');

        btn.innerHTML = '<span class="mobile-btn-icon">✅</span><span class="mobile-btn-text">Opened in Plex</span><span class="mobile-btn-arrow"></span>';
        setTimeout(() => closePlaybackModal(), 1500);
    }
}

// Make function globally accessible
window.showPlaybackModal = function(ratingKey, movieTitle, libraryType, backdropUrl, logoUrl) {
    console.log('showPlaybackModal called with:', ratingKey, movieTitle, libraryType, backdropUrl, logoUrl);
    const modal = document.getElementById('playbackModal');
    const backdropElement = document.getElementById('playbackBackdrop');
    const logoContainer = document.getElementById('playbackLogoContainer');
    const logoElement = document.getElementById('playbackLogo');
    const roomsGrid = document.getElementById('playbackRoomsGrid');
    const loadingElement = document.getElementById('playbackLoading');
    const errorElement = document.getElementById('playbackError');

    // Reset modal state completely
    loadingElement.style.display = 'none';
    loadingElement.innerHTML = `
        <div class="spinner"></div>
        <span>Starting playback...</span>
    `;
    errorElement.style.display = 'none';
    roomsGrid.style.display = 'grid';

    // Hide resume options
    const resumeOptions = document.getElementById('playbackResumeOptions');
    if (resumeOptions) {
        resumeOptions.style.display = 'none';
    }

    // Show the choose text when opening modal
    const chooseText = document.querySelector('.playback-choose-text');
    if (chooseText) {
        chooseText.style.display = 'block';
    }

    // Reset current room tracking
    currentPlaybackRoomId = null;
    currentPlaybackRoomName = null;
    currentResumeInfo = null;

    // Store playback info for now playing modal
    currentPlaybackTitle = movieTitle;
    currentPlaybackBackdropUrl = backdropUrl;
    currentPlaybackLogoUrl = logoUrl;
    currentPlaybackEpisodeTitle = null;
    currentPlaybackSeasonEpisode = null;

    // Set backdrop image
    console.log('Setting backdrop URL:', backdropUrl);
    if (backdropUrl) {
        backdropElement.style.backgroundImage = `url("${backdropUrl}")`;
        console.log('Backdrop style set to:', backdropElement.style.backgroundImage);
    } else {
        console.log('No backdrop URL provided, using gradient fallback');
        backdropElement.style.backgroundImage = 'linear-gradient(135deg, #667eea 0%, #764ba2 100%)';
    }

    // Set logo image
    console.log('Setting logo URL:', logoUrl);
    if (logoUrl) {
        logoElement.src = logoUrl;
        logoContainer.style.display = 'flex';
    } else {
        logoContainer.style.display = 'none';
    }

    // Handle episode title for TV shows
    const showTitleElement = document.getElementById('playbackShowTitle');
    const episodeTitleElement = document.getElementById('playbackEpisodeTitle');
    const episodeInfoElement = document.getElementById('playbackEpisodeInfo');

    if (movieTitle && movieTitle.includes(' - S')) {
        // This is a TV episode (format: "Show Name - S01E01: Episode Title")
        const parts = movieTitle.split(' - ');
        if (parts.length >= 2) {
            const showName = parts[0];
            const episodePart = parts[1]; // e.g., "S01E01: Episode Title"

            // Parse S01E01: Episode Title
            const match = episodePart.match(/S(\d+)E(\d+):\s*(.+)/);
            if (match) {
                const seasonNum = parseInt(match[1]);
                const episodeNum = parseInt(match[2]);
                const episodeName = match[3] || '';
                const formattedInfo = `Season ${seasonNum} • Episode ${episodeNum}`;

                // Show title only if no clearlogo
                if (!logoUrl) {
                    showTitleElement.textContent = showName;
                    showTitleElement.style.display = 'block';
                } else {
                    showTitleElement.style.display = 'none';
                }

                // Show episode title
                if (episodeName) {
                    episodeTitleElement.textContent = episodeName;
                    episodeTitleElement.style.display = 'block';
                } else {
                    episodeTitleElement.style.display = 'none';
                }

                episodeInfoElement.textContent = formattedInfo;
                episodeInfoElement.style.display = 'block';
            } else {
                showTitleElement.style.display = 'none';
                episodeTitleElement.style.display = 'none';
                episodeInfoElement.style.display = 'none';
            }
        } else {
            showTitleElement.style.display = 'none';
            episodeTitleElement.style.display = 'none';
            episodeInfoElement.style.display = 'none';
        }
    } else {
        // Movie - hide episode info
        showTitleElement.style.display = 'none';
        episodeTitleElement.style.display = 'none';
        episodeInfoElement.style.display = 'none';
    }

    currentPlaybackRatingKey = ratingKey;

    // Check if playbackService is loaded
    if (!window.playbackService || typeof window.playbackService.getAllRooms !== 'function') {
        console.error('[PlaybackModal] playbackService not initialized yet.');
        console.log('[PlaybackModal] window.playbackService:', window.playbackService);
        console.log('[PlaybackModal] Attempting to wait for initialization...');

        // Try waiting a bit for initialization
        let attempts = 0;
        const checkInterval = setInterval(() => {
            attempts++;
            if (window.playbackService && typeof window.playbackService.getAllRooms === 'function') {
                console.log('[PlaybackModal] playbackService initialized after', attempts, 'attempts');
                clearInterval(checkInterval);
                // Re-call the function now that service is ready
                showPlaybackModal(ratingKey, movieTitle, libraryType, backdropUrl, logoUrl);
            } else if (attempts >= 10) {
                console.error('[PlaybackModal] playbackService failed to initialize after 10 attempts');
                errorElement.innerHTML = 'Playback service is not ready. Please refresh the page and try again.';
                errorElement.style.display = 'block';
                roomsGrid.style.display = 'none';
                modal.style.display = 'block';
                clearInterval(checkInterval);
            }
        }, 100);

        return;
    }

    // Get all rooms
    const rooms = window.playbackService.getAllRooms();

    // Clear and populate rooms grid
    roomsGrid.innerHTML = '';

    rooms.forEach(room => {
        const roomBtn = document.createElement('div');
        roomBtn.className = 'playback-room-btn';
        if (!room.ip) {
            roomBtn.classList.add('disabled');
        }

        roomBtn.innerHTML = `
            <div class="playback-room-icon">
                <i class="${room.icon}"></i>
            </div>
            <div class="playback-room-name">${room.name}</div>
            <div class="playback-room-status ${room.ip ? 'configured' : ''}">
                ${room.ip ? 'Available' : 'Not Configured'}
            </div>
        `;

        if (room.ip) {
            roomBtn.onclick = () => playInRoom(room.id, room.name);
        }

        roomsGrid.appendChild(roomBtn);
    });


    // Show "Watch on this device" on all devices (browser-based playback)
    const mobileDeviceSection = document.getElementById('playbackMobileDevice');
    if (mobileDeviceSection) {
        mobileDeviceSection.style.display = 'block';
        // Reset the button text
        const mobileBtn = document.getElementById('playbackMobileBtn');
        if (mobileBtn) {
            mobileBtn.innerHTML = '<span class="mobile-btn-icon">▶️</span><span class="mobile-btn-text">Watch on this device</span><span class="mobile-btn-arrow"><i class="fas fa-chevron-right"></i></span>';
        }
    }

    // Show modal
    modal.style.display = 'flex';
}

async function playInRoom(roomId, roomName) {
    const roomsGrid = document.getElementById('playbackRoomsGrid');
    const loadingElement = document.getElementById('playbackLoading');
    const errorElement = document.getElementById('playbackError');
    const errorMessage = document.getElementById('playbackErrorMessage');
    const chooseText = document.querySelector('.playback-choose-text');
    const resumeOptions = document.getElementById('playbackResumeOptions');

    // Save room info for later
    currentPlaybackRoomId = roomId;
    currentPlaybackRoomName = roomName;

    // Store the room's IP for the now playing modal
    const room = window.playbackService.getRoom(roomId);
    if (room) {
        currentPlaybackClientIp = room.ip;
    }

    // Hide room grid and show loading
    roomsGrid.style.display = 'none';
    if (chooseText) {
        chooseText.style.display = 'none';
    }
    loadingElement.style.display = 'block';
    loadingElement.innerHTML = `
        <div class="spinner"></div>
        <span>Checking resume point...</span>
    `;

    try {
        // Fetch resume info
        const resumeInfo = await window.playbackService.getResumeInfo(currentPlaybackRatingKey);
        currentResumeInfo = resumeInfo;

        // Hide loading
        loadingElement.style.display = 'none';

        // If there's a resume point, show options
        if (resumeInfo.has_resume_point) {
            document.getElementById('playbackResumeTime').textContent = resumeInfo.time_string;
            resumeOptions.style.display = 'flex';
        } else {
            // No resume point, start playback immediately
            startPlayback(0);
        }
    } catch (error) {
        console.error('Error checking resume info:', error);
        // On error, just start from beginning
        startPlayback(0);
    }
}

async function startPlayback(resumeOffset) {
    const loadingElement = document.getElementById('playbackLoading');
    const errorElement = document.getElementById('playbackError');
    const errorMessage = document.getElementById('playbackErrorMessage');
    const resumeOptions = document.getElementById('playbackResumeOptions');

    console.log('[PlaybackModal] Starting playback:', {
        roomId: currentPlaybackRoomId,
        ratingKey: currentPlaybackRatingKey,
        resumeOffset: resumeOffset
    });

    // Hide resume options
    resumeOptions.style.display = 'none';

    // Show loading state
    loadingElement.style.display = 'block';
    loadingElement.innerHTML = `
        <div class="spinner"></div>
        <span>Starting playback...</span>
    `;
    errorElement.style.display = 'none';

    try {
        // Attempt to play in the selected room (await the promise to catch errors)
        console.log('[PlaybackModal] Calling playInRoom...');
        await window.playbackService.playInRoom(currentPlaybackRoomId, currentPlaybackRatingKey, resumeOffset);
        console.log('[PlaybackModal] playInRoom returned successfully');

        // Poll Plex to check when playback actually starts
        let pollCount = 0;
        const maxPolls = 30; // Poll for up to 30 seconds
        const pollInterval = setInterval(async () => {
            pollCount++;

            try {
                // Check Plex player status
                const response = await fetch(`/api/player/status/${currentPlaybackRatingKey}`);
                const data = await response.json();

                if (data.playing) {
                    // Playback confirmed!
                    clearInterval(pollInterval);

                    loadingElement.innerHTML = `
                        <i class="fas fa-check-circle" style="color: #10b981; font-size: 40px; margin-bottom: 10px;"></i>
                        <div style="color: #10b981;">Playing in ${currentPlaybackRoomName}</div>
                    `;

                    // Store duration if available
                    currentPlaybackDuration = data.duration || 0;

                    // Show now playing modal (desktop only)
                    if (window.innerWidth >= 1024 && typeof window.showNowPlayingModal === 'function') {
                        // Capture all values BEFORE closing modal (which nulls them)
                        const nowPlayingOptions = {
                            ratingKey: currentPlaybackRatingKey,
                            clientId: currentPlaybackRoomId,
                            clientIp: currentPlaybackClientIp,
                            title: currentPlaybackTitle,
                            backdropUrl: currentPlaybackBackdropUrl,
                            clearlogoUrl: currentPlaybackLogoUrl,
                            roomName: currentPlaybackRoomName,
                            duration: currentPlaybackDuration,
                            episodeTitle: currentPlaybackEpisodeTitle,
                            seasonEpisode: currentPlaybackSeasonEpisode,
                            movieData: currentPlaybackMovieData
                        };
                        setTimeout(() => {
                            closePlaybackModal();
                            window.showNowPlayingModal(nowPlayingOptions);
                        }, 1000);
                    } else {
                        // Close modal after showing success message (mobile)
                        setTimeout(() => {
                            closePlaybackModal();
                        }, 2000);
                    }
                }
            } catch (error) {
                console.error('Error checking playback status:', error);
            }

            // Timeout after max polls
            if (pollCount >= maxPolls) {
                clearInterval(pollInterval);

                // Show success anyway (best effort)
                loadingElement.innerHTML = `
                    <i class="fas fa-check-circle" style="color: #10b981; font-size: 40px; margin-bottom: 10px;"></i>
                    <div style="color: #10b981;">Playing in ${currentPlaybackRoomName}</div>
                `;

                // Show now playing modal (desktop only)
                if (window.innerWidth >= 1024 && typeof window.showNowPlayingModal === 'function') {
                    // Capture all values BEFORE closing modal (which nulls them)
                    const nowPlayingOptions = {
                        ratingKey: currentPlaybackRatingKey,
                        clientId: currentPlaybackRoomId,
                        clientIp: currentPlaybackClientIp,
                        title: currentPlaybackTitle,
                        backdropUrl: currentPlaybackBackdropUrl,
                        clearlogoUrl: currentPlaybackLogoUrl,
                        roomName: currentPlaybackRoomName,
                        duration: currentPlaybackDuration || 0,
                        episodeTitle: currentPlaybackEpisodeTitle,
                        seasonEpisode: currentPlaybackSeasonEpisode,
                        movieData: currentPlaybackMovieData
                    };
                    setTimeout(() => {
                        closePlaybackModal();
                        window.showNowPlayingModal(nowPlayingOptions);
                    }, 1000);
                } else {
                    setTimeout(() => {
                        closePlaybackModal();
                    }, 2000);
                }
            }
        }, 1000); // Poll every second

    } catch (error) {
        console.error('Playback error:', error);

        // Show error
        loadingElement.style.display = 'none';
        errorElement.style.display = 'block';
        errorMessage.textContent = error.message || 'Failed to start playback';

        // Show resume options again after error
        setTimeout(() => {
            errorElement.style.display = 'none';
            resumeOptions.style.display = 'flex';
        }, 3000);
    }
}

// Event listeners for resume buttons
document.getElementById('playbackResumeBtn').addEventListener('click', () => {
    if (currentResumeInfo) {
        startPlayback(currentResumeInfo.offset_ms);
    }
});

document.getElementById('playbackStartOverBtn').addEventListener('click', () => {
    startPlayback(0);
});

function closePlaybackModal() {
    const modal = document.getElementById('playbackModal');
    modal.style.display = 'none';
    currentPlaybackRatingKey = null;
}

// Close modal on escape key
document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') {
        closePlaybackModal();
    }
});
</script>
