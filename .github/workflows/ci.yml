name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Check for hard-coded URLs
        run: bash frontend/check-hardcoded-urls.sh

      - name: Place the built SPA where Flask serves it
        run: |
          rm -rf static/spa
          cp -r frontend/dist static/spa

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip

      - name: Install Python dependencies
        run: pip install -r requirements.txt pytest pytest-randomly

      - name: Run tests
        env:
          FLASK_STATIC_FOLDER: ${{ github.workspace }}/static
          LUMA_SKIP_BACKGROUND_THREADS: '1'
        run: |
          export HERO_CACHE_DIR="$RUNNER_TEMP/hero"
          python -m pytest -p randomly tests
          test -f static/spa/index.html
          python -m pytest tests/test_url_base_spa.py -rs | tee spa.log
          ! grep -q SKIPPED spa.log
